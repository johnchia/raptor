# Raptor configuration for the SigmaStar SSC30KQ + GC4653 test board.
#
# This is the phase-2d bring-up config: one H.264 main stream over RTSP and
# nothing else. Everything the SigmaStar backend does not implement yet is
# switched off explicitly rather than left to its default, so a failed run
# points at the video path instead of at OSD, JPEG or audio.
#
# Copy to /etc/raptor.conf on the board, or pass with -c.
#
#   rvd -f -d -c /etc/raptor.conf
#   rsd -f -d -c /etc/raptor.conf
#
# Stop divinus first — it holds the MI devices.

[sensor]
# Nothing is required here any more. The HAL names the sensor from
# /proc/modules before init and reports its geometry from MI_SNR after Enable,
# so both the identity and the resolution are discovered rather than declared.
#
# name        - override the detected name. Advisory on this backend: MI
#               addresses the sensor by index, so a mismatch is reported as a
#               warning (probably a config copied from another board) and the
#               detected name is used regardless.
# i2c_addr    - not needed. The sensor driver owns the bus; the daemon skips
#               its usual i2c requirement when the HAL reports has_sensor_detect.
# width/height- select among the modes the sensor driver enumerates, for sensors
#               that have more than one. GC4653 has exactly one, so these can
#               only match it or be warned about. Omitted = native mode.
# fps         - sensor rate, applied with MI_SNR_SetFps inside the chosen mode
#               and clamped to that mode's range. Omitted = the mode's maximum.
# iq_file     - ISP tuning binary. Omitted is correct on OpenIPC: the HAL
#               derives /etc/sensors/<sensor>.bin from the detected name, which
#               is where OpenIPC installs the tuned file for this sensor. Only
#               needed for a tuning file kept somewhere else.
low_latency = false

# Mains frequency, for flicker cancellation: 0 = off, 1 = 50 Hz, 2 = 60 Hz.
# Unlike the [image] knobs this is applied unconditionally — it depends on
# where the camera is installed, which a tuning file shipped with the sensor
# cannot know. rvd defaults to 2, so set it to 1 on 50 Hz mains.
antiflicker = 2

[stream0]
width = 2560
height = 1440
fps = 30
codec = h264
profile = 2                   # high; the backend clamps H.264 to 2, H.265 to 1
bitrate = 4000000
rc_mode = cbr
gop = 60                      # 2 s. star_probe -c ran exactly this
                              # configuration and produced a stream that plays,
                              # so a failure here is rvd's plumbing rather than
                              # the encoder setup. It also keeps gop > fps,
                              # which matters: rvd sizes the ring with an 8x
                              # I-frame multiplier instead of 4x once gop <=
                              # fps, doubling the /dev/shm allocation for no
                              # reason here.

# Phase 5 made this safe to turn on. It used to be load-bearing rather than
# cosmetic: rvd builds its bind chain as FS [-> IVS] [-> OSD] -> ENC, and the
# backend accepted only FS -> ENC, so leaving OSD on inserted a stage that was
# rejected and the bind failure took the whole stream down. hal_bind now
# collapses the OSD stage, because MI composites overlays onto the VPE port
# instead of putting a module in the data path.
osd_enabled = true
jpeg = false                  # MJPEG is wired in the encoder but unverified

[stream1]
# Verified on the board alongside the main stream at exactly these settings.
# Worth noting what did *not* happen: divinus drops frames and produces corrupt
# timing on a low-rate substream on this same hardware, and raptor does not, so
# that bug is divinus's pacing rather than anything about the SoC or MI.
enabled = true
width = 640
height = 360
fps = 5
codec = h264
profile = 2
bitrate = 1000000
rc_mode = cbr
gop = 30
# Off on the substream for the first OSD run: one stream carrying overlays and
# one deliberately without makes it obvious whether a region landed on the port
# it was registered to, rather than on every port.
osd_enabled = false
jpeg = false

[ring]
# Must stay false. MI recycles the VENC stream buffer as soon as
# MI_VENC_ReleaseStream returns, so a reference published across that
# boundary reads whatever the next frame overwrote it with. The backend
# leaves enc_get_rmem_info unimplemented, so rvd would fall back to copying
# anyway, but do not rely on that.
refmode = false

[image]
# Deliberately left at defaults, and that is now a meaningful choice rather
# than a limitation.
#
# Phase 3 loads the tuned /etc/sensors/gc4653.bin at startup, which replaces
# the generic /etc/firmware/iqfile0.bin CUS3A would otherwise pick up — that
# was the whole cause of the colour cast, and no [image] key was ever going
# to fix it.
#
# With a tuned file in effect, the right thing for these keys to do is
# nothing. The backend treats a knob left at its neutral 128 as "leave this
# module on auto", so the tuning file's own curves stay in charge. Setting one
# switches just that module to manual and pins it — useful for a deliberate
# adjustment, counterproductive as a default. Setting it back to 128 restores
# auto.
#
# Implemented here: brightness, contrast, saturation, sharpness, sinter,
# temper, ae_comp, max_again, max_dgain, defog, hflip, vflip. The rest return
# NOTSUP and are ignored — see hal_isp.c's OP COVERAGE comment for which and
# why (mostly MI controls that are toggles or curves rather than 0..255
# strengths).
#
# max_again/max_dgain are the exception to the 0..255 convention: they are
# passed to MI's AE unscaled, so they mean MI gain units here, not Ingenic
# gain codes. rvd's defaults (160/80) are Ingenic values, so set these
# explicitly if you care about the ceiling.
#
# hflip/vflip are read early, before the sensor starts, because orientation is
# a sensor register that the driver latches during bring-up. Set them here for
# a camera mounted upside down and they hold from the first frame. Changing
# them on a running pipeline is best-effort by comparison — see the comment
# above hal_isp.c's mirror/flip ops. Restart rvd if a change does not take.
# hflip = 1
# vflip = 1

[jpeg]
enabled = false

[audio]
# rad brings the AI device up on this board, and running it alongside rvd
# confirms the thing that was uncertain about it: two processes calling
# MI_SYS_Init is fine here.
#
# The first run also found the one missing step, worth knowing because the
# symptom was so unhelpful -- an MI channel's output port has no user-side
# queue until MI_SYS_SetChnOutputPortDepth gives it one, so MI_AI_GetFrame
# returned NOBUF forever while the device reported itself enabled. The HAL
# now sets it per channel at init and names MI's error codes in the log.
enabled = true

# MI's AI "device" selects the *physical* input — the vendor reference lists
# Amic/Dmic/I2S RX/Line in — so it is a board property, not an index to pick
# freely. 0 is the onboard analog path, which is what both reference streamers
# use. rad's own default is 1 (an Ingenic index), so setting it here keeps the
# HAL from having to warn and correct it.
device = 0

# 8000, 16000, 32000 or 48000 only. MI supports no others, and its resampler
# is one of the algorithm packs absent from this platform, so anything else is
# refused at init rather than quietly resampled.
sample_rate = 16000

# 0..100, mapped onto MI's per-device analog gain table (Amic spans about
# -6..+57 dB, so the mapping is steep). The HAL logs the index it picked at
# startup. Lower this if capture clips; there is no separate `gain` key on
# this backend, because MI has exactly one input gain control and volume owns
# it.
volume = 80

# codec = l16 is uncompressed and the least likely to hide a capture problem
# behind an encoder one. opus/g711/aac are all software encoders in rad.
codec = l16

# SCHED_FIFO priority for the capture loop; 0 leaves scheduling alone.
#
# The AI device overwrites periods rad has not collected yet, so a late read
# costs recorded audio rather than latency. At SCHED_OTHER on this single-core
# A7 the loop lost that race against video encoding -- MI logged "Buffer(s) is
# lost due to slow fetching" and rad logged a "+151ms" clock resync, which are
# the two halves of one dropout. The loop wakes 50 times a second and runs for
# a millisecond or two, so a low RT priority cannot starve the encoder, and any
# vendor RT thread above this priority still wins.
#
# If audio dropouts persist, check rad's periodic "worst read gap" line first:
# a gap near 20ms means the loss is inside the SDK and this knob is not the
# lever, while a large gap means the loop is still being preempted.
rt_priority = 10

# Noise reduction, AGC, high-pass filtering and echo cancellation are all MI
# VQE features, and they are not available on this platform. Leave them off.
# The ops return NOTSUP, so these keys do nothing either way -- but do not go
# looking for a way to force them on: OpenIPC ships none of the Iaa*
# algorithm libraries MI_AI needs, MI does not null-check before calling
# them, and an unresolved weak symbol means a jump to address 0. Enabling
# them would crash rad rather than sound worse.
#
# codec: only g711 and l16 are compiled in. AAC needs AAC=1 plus libfaac,
# opus needs OPUS=1 plus libopus, and neither library is in this firmware.
ns_enabled = false
hpf_enabled = false
agc_enabled = false
aec_enabled = false

[rtsp]
enabled = true
port = 554
max_clients = 4
# A new viewer forces a keyframe rather than waiting up to a GOP for one.
# Worth leaving on for the first test: a client that appears to connect but
# shows nothing is the symptom this prevents.
idr_on_join = true
sei_timecode = false          # code default is true; off for a first run so the
                              # bitstream is exactly what the encoder produced

[http]
enabled = false

[osd]
# This is the key that decides the bind chain: rvd reads it into
# st->osd_enabled and inserts the OSD stage on its strength alone, without
# checking caps or whether osd_create_group succeeded. Before phase 5 that
# made it the one key which stopped rvd from starting at all; the backend now
# collapses the stage, so this is an ordinary feature switch again.
#
# This key only decides whether the OSD machinery runs. What lands on the
# picture comes from the [osd.*] sections below — and from rod, which is the
# part that surprises people: rvd does not render text. rod expands the
# templates, rasterises glyphs into /dev/shm/rss_osd_osd_<stream>_<name>, and
# rvd only discovers those SHM objects and uploads them to MI_RGN. With rod not
# running, rvd logs "0 regions created" and the picture is clean no matter what
# the [osd.*] sections say.
#
# The HAL logs which pixel format MI accepted at the first region create.
enabled = true

# rod loads this with libschrift. The path is where majestic-fonts installs
# UbuntuMono, which is the only TrueType file in this image; rod's own default
# (/usr/share/fonts/default.ttf) does not exist here and is fatal to rod.
font = /usr/share/fonts/truetype/UbuntuMono-Regular.ttf
font_size = 24

[osd.timestamp]
# The minimum useful overlay, and a good first check that the whole chain works:
# rod renders -> SHM -> rvd uploads -> MI_RGN composites onto the VPE port.
# It appears on stream0 only, because [stream1] osd_enabled is false.
type = text
template = %time%
position = top_left
align = left
max_chars = 22

[osd.uptime]
# Second region, deliberately at the opposite corner: two regions at different
# layers is what shows the per-region attach works, and uptime changing while
# the clock also changes proves both are being updated rather than one being
# redrawn twice.
type = text
template = %uptime%
position = top_right
align = right
max_chars = 18

[ircut]
# Off until the day/night phase lands. ric is in the image and the init script
# starts it, but with no GPIO or luma ops in this backend yet there is nothing
# for it to do; it reads this key first and exits cleanly, which is why leaving
# it in the boot sequence costs nothing.
enabled = false

[recording]
enabled = false

[motion]
enabled = false

[webrtc]
enabled = false

[rvd]
# SSC30KQ is single-core. Do not pin rvd and rsd to different CPUs here —
# the second affinity would be invalid and there is nothing to gain.

[log]
# Image defaults, not bring-up defaults. S95raptor starts every daemon with
# start-stop-daemon -b, so stderr goes nowhere and a stderr target would lose
# the log entirely; syslog is what OpenIPC collects (read it with `logread`).
#
# level is info rather than debug because five daemons at debug will flood a
# soak. To diagnose something, stop the service and run the one daemon you care
# about in the foreground:
#
#   /etc/init.d/S95raptor stop
#   rvd -f -d -c /etc/raptor.conf
level = info
target = syslog
