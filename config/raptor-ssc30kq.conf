# Raptor configuration for the SigmaStar SSC30KQ + GC4653 test board.
#
# This is the phase-2d bring-up config: one H.264 main stream over RTSP and
# nothing else. Everything the SigmaStar backend does not implement yet is
# switched off explicitly rather than left to its default, so a failed run
# points at the video path instead of at OSD, JPEG or audio.
#
# Copy to /etc/raptor.conf on the board, or pass with -c.
#
#   rvd -f -d -c /etc/raptor.conf
#   rsd -f -d -c /etc/raptor.conf
#
# Stop divinus first — it holds the MI devices.

[sensor]
# Nothing is required here any more. The HAL names the sensor from
# /proc/modules before init and reports its geometry from MI_SNR after Enable,
# so both the identity and the resolution are discovered rather than declared.
#
# name        - override the detected name. Advisory on this backend: MI
#               addresses the sensor by index, so a mismatch is reported as a
#               warning (probably a config copied from another board) and the
#               detected name is used regardless.
# i2c_addr    - not needed, and nothing reads it. The sensor sits on the ISP's
#               own i2c master, driven by the sensor .ko (its i2c_slave_id
#               module parameter), so no MI call takes an address. The daemon
#               warns that the key is absent and carries on.
# fps         - sensor rate, applied with MI_SNR_SetFps and clamped to the
#               native mode's range. Omitted = the mode's maximum. The sensor
#               starts at that maximum either way and drops to this while the
#               pipeline is still being built, so no stream sees the ceiling.
#
# The ISP tuning binary needs no key at all: the HAL derives <sensor>.bin from
# the detected module name and looks in /etc/sensors then /usr/share/sensor,
# which is where OpenIPC and thingino respectively install it.
low_latency = false

# Mains frequency, for flicker cancellation: 0 = off, 1 = 50 Hz, 2 = 60 Hz.
# Unlike the [image] knobs this is applied unconditionally — it depends on
# where the camera is installed, which a tuning file shipped with the sensor
# cannot know. rvd defaults to 2, so set it to 1 on 50 Hz mains.
antiflicker = 2

[stream0]
width = 2560
height = 1440
fps = 30
codec = h264
profile = 2                   # high; the backend clamps H.264 to 2, H.265 to 1
bitrate = 4000000
rc_mode = cbr
gop = 60                      # 2 s. Keeps gop > fps,
                              # which matters: rvd sizes the ring with an 8x
                              # I-frame multiplier instead of 4x once gop <=
                              # fps, doubling the /dev/shm allocation for no
                              # reason here.

# Phase 5 made this safe to turn on. It used to be load-bearing rather than
# cosmetic: rvd builds its bind chain as FS [-> IVS] [-> OSD] -> ENC, and the
# backend accepted only FS -> ENC, so leaving OSD on inserted a stage that was
# rejected and the bind failure took the whole stream down. hal_bind now
# collapses the OSD stage, because MI composites overlays onto the VPE port
# instead of putting a module in the data path.
osd_enabled = true
jpeg = false                  # MJPEG is wired in the encoder but unverified

[stream1]
# Verified on the board alongside the main stream at exactly these settings.
# Worth noting what did *not* happen: divinus drops frames and produces corrupt
# timing on a low-rate substream on this same hardware, and raptor does not, so
# that bug is divinus's pacing rather than anything about the SoC or MI.
enabled = true
width = 640
height = 360
fps = 5
codec = h264
profile = 2
bitrate = 1000000
rc_mode = cbr
gop = 30
# Off on the substream for the first OSD run: one stream carrying overlays and
# one deliberately without makes it obvious whether a region landed on the port
# it was registered to, rather than on every port.
osd_enabled = false
jpeg = false

[ring]
# Must stay false. MI recycles the VENC stream buffer as soon as
# MI_VENC_ReleaseStream returns, so a reference published across that
# boundary reads whatever the next frame overwrote it with. The backend
# leaves enc_get_rmem_info unimplemented, so rvd would fall back to copying
# anyway, but do not rely on that.
refmode = false

[image]
# Deliberately left at defaults, and that is now a meaningful choice rather
# than a limitation.
#
# Phase 3 loads the tuned /etc/sensors/gc4653.bin at startup, which replaces
# the generic /etc/firmware/iqfile0.bin CUS3A would otherwise pick up — that
# was the whole cause of the colour cast, and no [image] key was ever going
# to fix it.
#
# With a tuned file in effect, the right thing for these keys to do is
# nothing. The backend treats a knob left at its neutral 128 as "leave this
# module on auto", so the tuning file's own curves stay in charge. Setting one
# switches just that module to manual and pins it — useful for a deliberate
# adjustment, counterproductive as a default. Setting it back to 128 restores
# auto.
#
# Implemented here: brightness, contrast, saturation, sharpness, sinter,
# temper, ae_comp, max_again, max_dgain, defog, hflip, vflip. The rest return
# NOTSUP and are ignored — see hal_isp.c's OP COVERAGE comment for which and
# why (mostly MI controls that are toggles or curves rather than 0..255
# strengths).
#
# ae_comp is the exception to the paragraph above: MI's EV compensation has no
# auto mode to hand back to, so 128 cannot mean "leave it alone" by switching
# one off. Instead the backend reads the value the tuning binary left in the
# field and makes *that* what 128 maps to, so neutral writes it back unchanged
# and the halves either side are real compensation measured from the tuning's
# own point. How far each direction reaches depends on where that point sits,
# which the log says once per tuning load:
#
#   isp: ae_comp baseline from the tuning is MI 20/200 -- raptor 128 maps here,
#   so 0..127 darkens by up to 20 and 129..255 brightens by up to 180
#
# On this board that baseline reads back as 0, the floor of the range: EV
# compensation here is a positive-only boost and cannot darken at all.
#
# max_again/max_dgain are the exception to the 0..255 convention: MI's AE
# takes them in x1024 fixed point, 1024 being unity (the vendor's own constant
# for a 32x cap is 32768). rvd's defaults are Ingenic gain codes — 160 and 80 —
# and it applies them whether or not these keys appear here, so as x1024 they
# ask for ceilings of 0.16x and 0.08x. The backend now refuses anything below
# unity and logs it once, leaving the tuning file's calibrated ceiling in
# charge, which is the right default. Set these only to lower it deliberately.
#
# The gain ceiling cannot be raised past the tuning file's own, but on this
# board that is generous: gc4653.bin publishes
#   isp: AE tuning limits (x1024): sensor gain 1024..131072, isp gain 1024..1024,
#        shutter 22..50000 us
# i.e. 1x..128x of sensor gain and no digital gain at all — so both keys are
# best left unset here. The tuning's own 128x is the widest this board can have,
# and anything set here can only narrow it. max_dgain is doubly pointless: the
# ISP gain range is 1024..1024, one value.
#
# What LOOKED like a reason to set them: measured on this board, ninety seconds
# after startup, with nothing configured —
#   ae: limits shutter 300..14000 us, sensor gain 1024..8192, isp gain 1024..1024
# 3.5x less shutter and 16x less gain than the tuning permits, with the AE pinned
# on both ceilings and reporting avgY=0. That is not CUS3A narrowing a window: it
# is the ISP back on its factory defaults, i.e. the tuning gone. rvd detects that
# and reloads the binary — see docs/sigmastar.md — so the fix is not to fence the
# AE in with narrower numbers of our own.
#
# Should you set one anyway, it is re-asserted every couple of seconds, since a
# reload restores the tuning's values and would otherwise drop it:
#   isp: AE narrowed its limits to ...; restoring the configured ... and holding
#
# hflip/vflip are read early, before the sensor starts, because orientation is
# a sensor register that the driver latches during bring-up. Set them here for
# a camera mounted upside down and they hold from the first frame. Changing
# them on a running pipeline is best-effort by comparison — see the comment
# above hal_isp.c's mirror/flip ops. Restart rvd if a change does not take.
# hflip = 1
# vflip = 1

[jpeg]
enabled = false

[audio]
# rad brings the AI device up on this board, and running it alongside rvd
# confirms the thing that was uncertain about it: two processes calling
# MI_SYS_Init is fine here.
#
# The first run also found the one missing step, worth knowing because the
# symptom was so unhelpful -- an MI channel's output port has no user-side
# queue until MI_SYS_SetChnOutputPortDepth gives it one, so MI_AI_GetFrame
# returned NOBUF forever while the device reported itself enabled. The HAL
# now sets it per channel at init and names MI's error codes in the log.
enabled = true

# MI's AI "device" selects the *physical* input — the vendor reference lists
# Amic/Dmic/I2S RX/Line in — so it is a board property, not an index to pick
# freely. 0 is the onboard analog path, which is what both reference streamers
# use. rad's own default is 1 (an Ingenic index), so setting it here keeps the
# HAL from having to warn and correct it.
device = 0

# 8000, 16000, 32000 or 48000 only. MI supports no others, and its resampler
# is one of the algorithm packs absent from this platform, so anything else is
# refused at init rather than quietly resampled.
sample_rate = 16000

# 0..100, mapped onto MI's per-device analog gain table (Amic spans about
# -6..+57 dB, so the mapping is steep). The HAL logs the index it picked at
# startup. Lower this if capture clips; there is no separate `gain` key on
# this backend, because MI has exactly one input gain control and volume owns
# it.
volume = 80

# codec = l16 is uncompressed and the least likely to hide a capture problem
# behind an encoder one. opus/g711/aac are all software encoders in rad.
codec = l16

# Noise reduction, AGC, high-pass filtering and echo cancellation are all MI
# VQE features, and they are not available on this platform. Leave them off.
# The ops return NOTSUP, so these keys do nothing either way -- but do not go
# looking for a way to force them on: OpenIPC ships none of the Iaa*
# algorithm libraries MI_AI needs, MI does not null-check before calling
# them, and an unresolved weak symbol means a jump to address 0. Enabling
# them would crash rad rather than sound worse.
#
# codec: only g711 and l16 are compiled in. AAC needs AAC=1 plus libfaac,
# opus needs OPUS=1 plus libopus, and neither library is in this firmware.
ns_enabled = false
hpf_enabled = false
agc_enabled = false
aec_enabled = false

[rtsp]
enabled = true
port = 554
max_clients = 4
# A new viewer forces a keyframe rather than waiting up to a GOP for one.
# Worth leaving on for the first test: a client that appears to connect but
# shows nothing is the symptom this prevents.
idr_on_join = true
sei_timecode = false          # code default is true; off for a first run so the
                              # bitstream is exactly what the encoder produced

[http]
enabled = false

[osd]
# This is the key that decides the bind chain: rvd reads it into
# st->osd_enabled and inserts the OSD stage on its strength alone, without
# checking caps or whether osd_create_group succeeded. Before phase 5 that
# made it the one key which stopped rvd from starting at all; the backend now
# collapses the stage, so this is an ordinary feature switch again.
#
# This key only decides whether the OSD machinery runs. What lands on the
# picture comes from the [osd.*] sections below — and from rod, which is the
# part that surprises people: rvd does not render text. rod expands the
# templates, rasterises glyphs into /dev/shm/rss_osd_osd_<stream>_<name>, and
# rvd only discovers those SHM objects and uploads them to MI_RGN. With rod not
# running, rvd logs "0 regions created" and the picture is clean no matter what
# the [osd.*] sections say.
#
# The HAL logs which pixel format MI accepted at the first region create.
enabled = true

# rod loads this with libschrift. The path is where majestic-fonts installs
# UbuntuMono, which is the only TrueType file in this image; rod's own default
# (/usr/share/fonts/default.ttf) does not exist here and is fatal to rod.
font = /usr/share/fonts/truetype/UbuntuMono-Regular.ttf
font_size = 48

[osd.timestamp]
# The minimum useful overlay, and a good first check that the whole chain works:
# rod renders -> SHM -> rvd uploads -> MI_RGN composites onto the VPE port.
# It appears on stream0 only, because [stream1] osd_enabled is false.
type = text
template = %time%
position = top_left
align = left
max_chars = 22

[osd.uptime]
# Second region, deliberately at the opposite corner: two regions at different
# layers is what shows the per-region attach works, and uptime changing while
# the clock also changes proves both are being updated rather than one being
# redrawn twice.
type = text
#
# Doubles as the monitor line. %ae_luma% and %total_gain% are the two numbers
# [ircut] auto day/night decides on, so having them on the picture is how the
# night_luma / night_gain thresholds get calibrated -- watch them at dusk
# instead of polling `raptorctl ric status` in a second shell.
#
# total_gain is raw x1024 fixed point (1024 = unity), deliberately unscaled
# because that is the scale night_gain is written in. Either shows "--" when
# there is no reading rather than 0, which would look like a black scene and a
# zero gain instead of a missing signal: rvd zeroes the struct before the ISP
# is tuned, for the first second or so after boot.
#
# %soc_temp% is degrees C from the SigmaStar msys driver's TEMP_R attribute,
# which exists because this kernel has CONFIG_MS_CPU_FREQ. It also shows "--"
# rather than guessing if the node is absent.
#
# max_chars sizes the region, so it has to cover the widest this can render:
# "12d 23h 59m 59s | L255 G1048576 99C".
template = %uptime% | L%ae_luma% G%total_gain% %soc_temp%C
position = top_right
align = right
max_chars = 36

[ircut]
enabled = true

# Board pins, from the board this target was brought up on. Nothing
# auto-discovers these: /etc/thingino.json does not exist on an OpenIPC image,
# so on this platform the config *is* the pin source.
#
# ircut is a motor-driven filter across two pins -- ric drives one high and the
# other low for 100ms and then releases both, which is what an H-bridge pair
# needs and what a single-pin (held) filter must not get. Both LED pins are
# listed; only the 850nm one is switched, since ir940 defaults off.
#
# The two ircut pins are an H-bridge, so their order *is* the polarity: swapped,
# every switch drives the filter the wrong way, and day mode then runs with the
# filter parked out. That is not a subtle failure -- IR floods the sensor and
# daylight comes back with a purple cast. This order is board-verified; if a
# variant shows that cast in daylight, swap these two rather than reaching for
# the white balance.
#
# Before swapping, check the filter is being driven at all. A purple cast from
# an inverted H-bridge and one from a filter that never moves are identical
# from outside, and the second has its own causes -- pins left unset because
# GPIO discovery found nothing, for one. Confirm actuation first, then polarity.
gpio_ircut = 24
gpio_ircut2 = 23
gpio_irled = 60
gpio_irled2 = 59

# Auto day/night off the ISP's own AE. The two thresholds below are the ones to
# revisit on this platform, because their scale is not the Ingenic scale the
# defaults were chosen for:
#
#   total_gain is x1024 fixed point (1024 = 1.0x), sensor gain times ISP gain,
#   from MI_ISP_CUS3A_GetAeStatus. So 122880 is 120x and the inherited Ingenic
#   default of 80000 is about 78x -- a plausible-looking number on the wrong
#   scale, which is the worst kind.
#
#   ae_luma is the mean of the AE grid's Y lane, 0-255 per cell, from
#   MI_ISP_AE_GetAeHwAvgStats -- a different measurement from Ingenic's
#   GetAeLuma and not necessarily the same numbers for the same scene.
#
# Read the live values with `raptorctl ric status` (the exposure sub-object) in
# a lit room and a dark one, then set night_luma between them. If the HAL cannot
# confirm the AE grid layout it reports no luma at all and this falls back to
# gain alone -- which is why night_gain matters even when trigger = luma.
#
# Measured on this board in daylight, for calibrating against: total_gain 1026
# (so 1.00x, the AE has all its headroom), exposure_us 9689, ae_luma 45.
#
# The one thing to understand before touching night_luma: ae_luma is a
# *post-AE* measurement, and holding it constant is the AE's entire job. It sits
# near its target -- 45ish here -- in a lit room and in a dim one alike, and only
# falls once the AE has spent its shutter and gain and still cannot reach target.
# So night_luma is a darkness backstop, not a dimmer reading, and gain is the
# signal that actually tracks failing light.
#
# AND night_gain HAS TO SIT UNDER THE AE's OWN CEILING. rvd logs that ceiling
# at startup, and it is the number to calibrate against:
#   isp: AE tuning limits (x1024): sensor gain 1024..131072, isp gain 1024..1024,
#        shutter 22..50000 us -- so total_gain tops out at 131072
# A threshold above it can never be crossed, and auto night mode then simply
# never fires whatever the light does -- which is what the inherited 80000 did
# on the *untuned* ISP this board ran with for a night, where the ceiling was
# 8192.
#
# night_gain is deliberately pinned near the top of that range rather than
# calibrated to a dusk reading, because "the AE has run out of gain" is a
# threshold that needs no calibration and cannot drift with the scene, the lens
# or the season. The IR-cut filter then comes in when the AE has spent
# everything it has and still cannot reach target, which is the latest sensible
# moment and keeps colour for as long as colour is possible.
#
# Not 131072 itself: the test is `total_gain > night_gain` and the AE parks
# *exactly* on its ceiling in the dark, so the ceiling as a threshold is a
# trigger that never fires. 122880 is 120x -- the last 6% of the range -- which
# leaves slack for an AE that stops just short of its limit.
#
# Trade-off, and the reason to know this knob exists: pinned this high the
# switch happens late, so the last of the evening is a colour picture at 120x
# gain, which is noisy. Lower it (65536 is 64x, one stop down) to switch earlier
# and trade colour for a cleaner monochrome picture sooner.
#
# night_luma 20 is the backstop for the case that makes gain alone insufficient
# -- a scene with a bright light in frame, where the AE holds gain low and the
# rest of the picture is black regardless. 0 disables it and leaves gain as the
# only trigger.
mode = auto
trigger = luma
night_luma = 20
night_gain = 122880
day_gain_pct = 25

# The board has no photoresistor and no photosensor pin, and the kernel config
# has CONFIG_MS_SAR off, so trigger=adc has no device to open here either.

[recording]
enabled = false

[motion]
enabled = false

[webrtc]
enabled = false

[rvd]
# SSC30KQ is single-core. Do not pin rvd and rsd to different CPUs here —
# the second affinity would be invalid and there is nothing to gain.

[log]
# Image defaults, not bring-up defaults. S95raptor starts every daemon with
# start-stop-daemon -b, so stderr goes nowhere and a stderr target would lose
# the log entirely; syslog is what OpenIPC collects (read it with `logread`).
#
# level is info rather than debug because five daemons at debug will flood a
# soak. To diagnose something, stop the service and run the one daemon you care
# about in the foreground:
#
#   /etc/init.d/S95raptor stop
#   rvd -f -d -c /etc/raptor.conf
level = info
target = syslog
