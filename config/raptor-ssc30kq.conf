# Raptor configuration for the SigmaStar SSC30KQ + GC4653 test board.
#
# This is the phase-2d bring-up config: one H.264 main stream over RTSP and
# nothing else. Everything the SigmaStar backend does not implement yet is
# switched off explicitly rather than left to its default, so a failed run
# points at the video path instead of at OSD, JPEG or audio.
#
# Copy to /etc/raptor.conf on the board, or pass with -c.
#
#   rvd -f -d -c /etc/raptor.conf
#   rsd -f -d -c /etc/raptor.conf
#
# Stop divinus first — it holds the MI devices.

[sensor]
# Nothing is required here any more. The HAL names the sensor from
# /proc/modules before init and reports its geometry from MI_SNR after Enable,
# so both the identity and the resolution are discovered rather than declared.
#
# name        - override the detected name. Advisory on this backend: MI
#               addresses the sensor by index, so a mismatch is reported as a
#               warning (probably a config copied from another board) and the
#               detected name is used regardless.
# i2c_addr    - not needed. The sensor driver owns the bus; the daemon skips
#               its usual i2c requirement when the HAL reports has_sensor_detect.
# width/height- select among the modes the sensor driver enumerates, for sensors
#               that have more than one. GC4653 has exactly one, so these can
#               only match it or be warned about. Omitted = native mode.
# fps         - sensor rate, applied with MI_SNR_SetFps inside the chosen mode
#               and clamped to that mode's range. Omitted = the mode's maximum.
# iq_file     - ISP tuning binary. Omitted is correct on OpenIPC: the HAL
#               derives /etc/sensors/<sensor>.bin from the detected name, which
#               is where OpenIPC installs the tuned file for this sensor. Only
#               needed for a tuning file kept somewhere else.
low_latency = false

# Mains frequency, for flicker cancellation: 0 = off, 1 = 50 Hz, 2 = 60 Hz.
# Unlike the [image] knobs this is applied unconditionally — it depends on
# where the camera is installed, which a tuning file shipped with the sensor
# cannot know. rvd defaults to 2, so set it to 1 on 50 Hz mains.
antiflicker = 2

[stream0]
width = 2560
height = 1440
fps = 30
codec = h264
profile = 2                   # high; the backend clamps H.264 to 2, H.265 to 1
bitrate = 4000000
rc_mode = cbr
gop = 60                      # 2 s. star_probe -c ran exactly this
                              # configuration and produced a stream that plays,
                              # so a failure here is rvd's plumbing rather than
                              # the encoder setup. It also keeps gop > fps,
                              # which matters: rvd sizes the ring with an 8x
                              # I-frame multiplier instead of 4x once gop <=
                              # fps, doubling the /dev/shm allocation for no
                              # reason here.

# osd_enabled is load-bearing, not cosmetic. rvd builds its bind chain as
# FS [-> IVS] [-> OSD] -> ENC, and the SigmaStar hal_bind only accepts
# FS -> ENC. Leaving OSD on inserts a stage the backend rejects, and the
# bind failure takes the whole stream down.
osd_enabled = false
jpeg = false                  # MJPEG is wired in the encoder but unverified

[stream1]
# Verified on the board alongside the main stream at exactly these settings.
# Worth noting what did *not* happen: divinus drops frames and produces corrupt
# timing on a low-rate substream on this same hardware, and raptor does not, so
# that bug is divinus's pacing rather than anything about the SoC or MI.
enabled = true
width = 640
height = 360
fps = 5
codec = h264
profile = 2
bitrate = 1000000
rc_mode = cbr
gop = 30
osd_enabled = false
jpeg = false

[ring]
# Must stay false. MI recycles the VENC stream buffer as soon as
# MI_VENC_ReleaseStream returns, so a reference published across that
# boundary reads whatever the next frame overwrote it with. The backend
# leaves enc_get_rmem_info unimplemented, so rvd would fall back to copying
# anyway, but do not rely on that.
refmode = false

[image]
# Deliberately left at defaults, and that is now a meaningful choice rather
# than a limitation.
#
# Phase 3 loads the tuned /etc/sensors/gc4653.bin at startup, which replaces
# the generic /etc/firmware/iqfile0.bin CUS3A would otherwise pick up — that
# was the whole cause of the colour cast, and no [image] key was ever going
# to fix it.
#
# With a tuned file in effect, the right thing for these keys to do is
# nothing. The backend treats a knob left at its neutral 128 as "leave this
# module on auto", so the tuning file's own curves stay in charge. Setting one
# switches just that module to manual and pins it — useful for a deliberate
# adjustment, counterproductive as a default. Setting it back to 128 restores
# auto.
#
# Implemented here: brightness, contrast, saturation, sharpness, sinter,
# temper, ae_comp, max_again, max_dgain, defog, hflip, vflip. The rest return
# NOTSUP and are ignored — see hal_isp.c's OP COVERAGE comment for which and
# why (mostly MI controls that are toggles or curves rather than 0..255
# strengths).
#
# max_again/max_dgain are the exception to the 0..255 convention: they are
# passed to MI's AE unscaled, so they mean MI gain units here, not Ingenic
# gain codes. rvd's defaults (160/80) are Ingenic values, so set these
# explicitly if you care about the ceiling.

[jpeg]
enabled = false

[audio]
enabled = false

[rtsp]
enabled = true
port = 554
max_clients = 4
# A new viewer forces a keyframe rather than waiting up to a GOP for one.
# Worth leaving on for the first test: a client that appears to connect but
# shows nothing is the symptom this prevents.
idr_on_join = true
sei_timecode = false          # code default is true; off for a first run so the
                              # bitstream is exactly what the encoder produced

[http]
enabled = false

[osd]
# This is the key that actually decides the bind chain — rvd reads it into
# st->osd_enabled and inserts the OSD stage on its strength alone, without
# checking caps or whether osd_create_group succeeded. It defaults to true,
# so leaving it out is what makes rvd fail to start on this backend.
enabled = false

[recording]
enabled = false

[motion]
enabled = false

[webrtc]
enabled = false

[rvd]
# SSC30KQ is single-core. Do not pin rvd and rsd to different CPUs here —
# the second affinity would be invalid and there is nothing to gain.

[log]
level = debug
target = stderr
