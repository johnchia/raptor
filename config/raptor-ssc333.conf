# Raptor configuration for the SigmaStar SSC333 (Infinity6B0) + SC3336,
# as fitted to the TP-Link Kasa KD110 v2.
#
# Profile: 1080p main at 20 fps, 640x360 sub at 5 fps, and snapshots, sized
# to leave room for a web UI. Copy to /etc/raptor.conf on the board, or pass
# with -c.
#
# THIS CONFIG ASSUMES A 24 MB CARVEOUT, NOT THE STOCK 32 MB
#
# It requires the bootloader's mma_heap to be shrunk:
#
#     mma_heap=mma_heap_name0,miu=0,sz=0x1800000     24 MB
#
# replacing the auto-detected sz=0x2000000 (32 MB). Without that change this
# config still runs -- it simply leaves 10 MB of the pool unused and the web
# UI keeps the memory problem it had.
#
# READ THIS BEFORE CHANGING ANY RESOLUTION OR fps
#
# This is a 64 MB part. The bootloader reserves the multimedia carveout out
# of the same DRAM Linux is told about, so the two figures in /proc/cmdline
# are not additive -- mma comes out of LX_MEM, not alongside it:
#
#   LX_MEM=0x3FE0000   63.9 MB   everything Linux is told about
#     mma_heap                   24.0 MB  vendor pool (was 32.0)
#     cma                         2.0 MB
#     kernel image + misc         4.4 MB
#     -> userspace                        33.4 MB  (was 25.4)
#
# Those 8 MB are the whole point of this profile. At 3M the pool needs about
# 28 MB and cannot be shrunk, which pins userspace at 25.4 MB -- enough for
# raptor alone, which is why 3M at 20 fps runs indefinitely on its own, but
# not enough to absorb a web UI session on top.
#
# Two rules decide every later edit, and they are easy to get backwards:
#
#   Buffer cost scales with RESOLUTION and is independent of fps. The same
#   pool is allocated at 5 fps as at 20. Lowering fps does not buy memory.
#
#   Throughput cost scales with fps. The SoC is rated for 3M + D1 at 20 fps.
#   1080p at 20 sits well inside that, so this profile has encoder headroom
#   it did not have at 3M.
#
# Pool budget at these settings, VIF -> VPE bound realtime so no raw sensor
# buffers are held:
#
#   VPE port0  1080p NV12 x3 depth      8.90 MB
#   VPE port1  640x360 NV12 x3          0.99 MB
#   VPE port2  snapshot clone of port1  0.66 MB   (depth 2, see [jpeg])
#   VENC references, 1080p + sub        6.59 MB
#   VENC bitstream + RGN/OSD           ~4.50 MB
#   -----------------------------------------
#                                     ~21.6 MB of 24
#
# The VENC reference figure is the one estimate here; everything else is
# arithmetic from the configured geometry and the depths in star_state.h.
# If the pool reports tighter than this, that line is where the error is.
#
# Other points on the same curve, if the web UI needs more than 33.4 MB:
#
#   1600x900 main -> ~17.1 MB, so a 20 MB carveout (sz=0x1400000)
#   1280x720 main -> ~13.4 MB, so a 16 MB carveout (sz=0x1000000)
#
# and going the other way, 3M main + this sub + this snapshot is ~28.2 MB,
# which fits the stock 32 MB pool with ~3.8 MB spare but returns nothing to
# userspace.

[sensor]
# Nothing is required here. The HAL names the sensor from /proc/modules
# before init and reports its geometry from MI_SNR after Enable, so identity
# and resolution are both discovered. SC3336 is 2304x1296 native; the main
# stream below is scaled down from it by the VPE.
low_latency = false

# Mains frequency for flicker cancellation: 0 = off, 1 = 50 Hz, 2 = 60 Hz.
# Applied unconditionally, unlike the [image] knobs, because it depends on
# where the camera is installed and no shipped tuning file can know that.
antiflicker = 2

[stream0]
width = 1920
height = 1080
fps = 20
codec = h264
profile = 2                   # high; the backend clamps H.264 to 2, H.265 to 1
bitrate = 2000000
rc_mode = cbr
gop = 40                      # 2 s, and deliberately > fps. At gop <= fps rvd
                              # sizes the ring with an 8x I-frame multiplier
                              # instead of 4x, doubling the /dev/shm allocation
                              # for no benefit -- which this board cannot spend.
osd_enabled = true

# Load-bearing, not cosmetic. Per-stream `jpeg` defaults to TRUE whenever
# [jpeg] enabled is set, and a JPEG channel clones a VPE port from the
# stream it is paired with. Left at its default, this stream would clone a
# 1080p port and cost 5.93 MB instead of the sub stream's 0.66 MB.
jpeg = false

[stream1]
# 640x360 rather than true D1 (720x480), so the pair stays inside the
# 3M + D1 envelope with room over. This is also the stream snapshots are
# taken from -- see [jpeg].
enabled = true
width = 640
height = 360
fps = 5
codec = h264
profile = 2
bitrate = 512000
rc_mode = cbr
gop = 30                      # > fps, same reasoning as stream0
osd_enabled = false

jpeg = true                   # the snapshot channel rides this stream
jpeg_fps = 1
jpeg_quality = 75

[jpeg]
# Snapshots for the web UI, deliberately paired to the *sub* stream.
#
# The encoding is cheap. MJPEG is I6_VENC_CODEC_MJPG, a real VENC channel,
# but the backend binds its VPE port at the JPEG fps against the sensor's
# rate, so MI drops the surplus frames in hardware. (INFINITY6E does not set
# .jpeg_pulse, so rvd's software duty-cycling is off and that hardware pacing
# is what replaces it.) At 1 fps the encoder cost is negligible, and MJPEG is
# intra-only so it holds no reference frames.
#
# The cost that bites is the port. star_fs_clone_port gives the JPEG channel
# its own VPE output port cloned from the geometry of the stream it is paired
# with, at STAR_VPE_SNAP_QUEUE_DEPTH. That is allocated by resolution and is
# independent of fps, so lowering jpeg fps buys nothing:
#
#   cloned from stream1 (640x360)   0.66 MB    <- what this config does
#   cloned from stream0 (1080p)     5.93 MB
#   cloned from a 3M stream0        8.54 MB
#
# So snapshots are 640x360. For larger ones, raise the *sub* stream rather
# than pairing JPEG to the main: the snapshot inherits the sub's geometry,
# and a 1280x720 sub with JPEG on it costs 2.64 MB for the clone but also
# raises the sub's own ports, landing near 28 MB total -- back over 24.
#
# There are four VPE output ports. main + sub + snapshot uses three.
enabled = true
quality = 75
fps = 1
# Stop the JPEG encoder when nothing is asking. Saves encoder time between
# web UI polls; it does not release the port, which stays allocated.
idle = true

[ring]
# Must stay false on every SigmaStar target. MI recycles the VENC stream
# buffer as soon as MI_VENC_ReleaseStream returns, so a reference published
# across that boundary reads whatever the next frame overwrote it with. The
# backend leaves enc_get_rmem_info unimplemented, so rvd falls back to
# copying anyway, but do not rely on that.
refmode = false

# Pinned rather than left to the bitrate heuristic. Unset, rvd derives the
# data region from bitrate x an I-frame multiplier x slots, which grows
# silently if anyone raises a bitrate later.
#
# Sized against max_frame = bitrate * 4 / 8 / fps: 50 KB for the main stream,
# 51 KB for the sub. The JPEG ring sizes itself from resolution and quality
# and lands near 64 KB, which needs no help.
#
# Slot counts must be a power of two and no more than RSS_RING_MAX_SLOTS (64).
# rss_ring_create rejects anything else outright, and rvd treats a ring it
# cannot create as fatal, so a value like 24 here does not degrade -- it stops
# the daemon at startup with "failed to create ring main".
#
# 16 slots is 0.8 s of buffering on the main stream at 20 fps and 3.2 s on the
# sub at 5 fps, which is ample for RTSP pacing.
main_slots = 16
main_data_mb = 2
sub_slots = 16
sub_data_mb = 1

[image]
# Left at defaults, and on this platform that is not merely a preference.
# INFINITY6B0 advertises has_defog / has_sinter / has_temper / has_ae_comp /
# has_max_gain as false, so isp_set_* returns RSS_ERR_NOTSUP and rvd logs it
# at info and moves on. The sensor tuning binary stays in charge, which is
# the correct image -- just not an adjustable one.
#
# The flags are false because raptor reaches these knobs by poking a field at
# a hardcoded (payload size, manual offset) pair inside an opaque MI IQ
# struct, and those offsets were read out of an INFINITY6E libmi_isp.so.
# They describe that library build rather than the MI API, and a wrong offset
# does not fail: access is read-modify-write, so it lands a plausible value
# in the wrong field and the image quietly degrades. Deriving the correct
# offsets needs only the library, not a board:
#
#   arm-openipc-linux-musleabihf-objdump -d \
#       --disassemble=MI_ISP_IQ_GetBrightness libmi_isp.so
#
# prints the payload size into the size slot. If the five match INFINITY6E's,
# the flags can be turned on in hal_caps.c and this section becomes live.

[audio]
# Not brought up on this board. Enabling rad also pulls in libmi_ai, and
# nothing here has confirmed what the KD110 v2 has fitted.
enabled = false

[rtsp]
enabled = true
port = 554
# Each client costs userspace. Raise once the web UI's own footprint is known.
max_clients = 2
# A new viewer forces a keyframe rather than waiting up to a GOP for one.
idr_on_join = true

[http]
# rhd serves /snap. Enable it if the web UI fetches snapshots over HTTP
# rather than reading the JPEG ring directly.
enabled = false

[webrtc]
enabled = false

[recording]
enabled = false

[motion]
enabled = false

[rvd]
# Single core. Do not pin rvd and rsd to different CPUs -- the second
# affinity would be invalid and there is nothing to gain.

[log]
# syslog rather than stderr: the init script starts daemons with
# start-stop-daemon -b, so stderr goes nowhere and a stderr target loses the
# log entirely. Read it with `logread`.
#
# info rather than debug, because several daemons at debug will flood a soak
# on a board this size. To diagnose something, stop the service and run the
# one daemon you care about in the foreground with -f -d.
level = info
target = syslog
