# Raptor configuration for the SigmaStar SSC333 (Infinity6B0) + SC3336,
# as fitted to the TP-Link Kasa KD110 v2.
#
# Board-verified: 3M main at 20 fps with a 640x360 sub at 5 fps, streaming
# over RTSP. Copy to /etc/raptor.conf on the board, or pass with -c.
#
# READ THIS BEFORE CHANGING ANY RESOLUTION OR fps
#
# This is a 64 MB part and both memory pools are near their limit. The
# bootloader reserves the multimedia carveout out of the same DRAM Linux is
# told about, so the two figures below are not additive -- mma comes out of
# LX_MEM, not alongside it:
#
#   LX_MEM=0x3FE0000   63.9 MB   everything Linux is told about
#     mma_heap sz=0x2000000  32.0 MB  vendor pool: VPE ports, VENC references
#     cma                     2.0 MB
#     kernel image + misc     4.4 MB
#     -> userspace                    25.4 MB
#
# At the settings below the vendor pool runs at roughly 28 of its 32 MB
# (VPE output ports at depth 3, VENC reference frames, bitstream and RGN),
# and free userspace settles around 5 MB while streaming. Both are working
# margins, not comfortable ones.
#
# The practical consequence found on this board: raptor holds these settings
# indefinitely on its own, but a web UI session spawns processes whose
# footprint the remaining userspace cannot absorb. That is a whole-image
# budget problem rather than a raptor one, but it decides whether this
# profile survives in a given build.
#
# Two rules follow from the arithmetic, and they are easy to get backwards:
#
#   Buffer cost scales with RESOLUTION and is independent of fps. The same
#   pool is allocated at 5 fps as at 20. Lowering fps does not buy memory.
#
#   Throughput cost scales with fps. The SoC is rated for 3M + D1 at 20 fps,
#   so the main stream below is at that ceiling with nothing in reserve.
#
# So raise fps only against the rating, and raise resolution only against the
# pool. Dropping the main stream to 1080p is the lever that pays on both
# counts: it returns about 6.5 MB to the pool, which can then be handed to
# userspace by shrinking mma_heap to 0x1800000 (24 MB) in the bootloader.

[sensor]
# Nothing is required here. The HAL names the sensor from /proc/modules
# before init and reports its geometry from MI_SNR after Enable, so identity
# and resolution are both discovered. SC3336 is 2304x1296 native, which is
# the "3M" the SoC rating refers to.
low_latency = false

# Mains frequency for flicker cancellation: 0 = off, 1 = 50 Hz, 2 = 60 Hz.
# Applied unconditionally, unlike the [image] knobs, because it depends on
# where the camera is installed and no shipped tuning file can know that.
antiflicker = 2

[stream0]
width = 2304
height = 1296
fps = 20                      # the SoC rating, not a starting point. rvd's
                              # own default is 25, which is 25% over it and
                              # was enough on its own to make the board crawl.
codec = h264
profile = 2                   # high; the backend clamps H.264 to 2, H.265 to 1
bitrate = 3000000
rc_mode = cbr
gop = 40                      # 2 s, and deliberately > fps. At gop <= fps rvd
                              # sizes the ring with an 8x I-frame multiplier
                              # instead of 4x, doubling the /dev/shm allocation
                              # for no benefit -- which this board cannot spend.
osd_enabled = true
jpeg = false                  # see [jpeg]

[stream1]
# 640x360 rather than true D1 (720x480). Smaller than the rated sub-stream,
# so it stays inside the 3M + D1 envelope with room over.
enabled = true
width = 640
height = 360
fps = 5
codec = h264
profile = 2
bitrate = 512000
rc_mode = cbr
gop = 30                      # > fps, same reasoning as stream0
osd_enabled = false

[ring]
# Must stay false on every SigmaStar target. MI recycles the VENC stream
# buffer as soon as MI_VENC_ReleaseStream returns, so a reference published
# across that boundary reads whatever the next frame overwrote it with. The
# backend leaves enc_get_rmem_info unimplemented, so rvd falls back to
# copying anyway, but do not rely on that.
refmode = false

# Pinned rather than left to the bitrate heuristic. Unset, rvd derives the
# data region from bitrate x an I-frame multiplier x slots, which lands near
# 2.4 MB for the main stream here and grows silently if anyone raises the
# bitrate later. On a board with ~5 MB of userspace headroom that is not a
# number to leave implicit.
#
# Sized against max_frame = bitrate * 4 / 8 / fps: 75 KB for the main stream,
# 51 KB for the sub. Both regions carry comfortably more than their slot
# count needs.
main_slots = 24
main_data_mb = 2
sub_slots = 16
sub_data_mb = 1

[image]
# Left at defaults, and on this platform that is not merely a preference.
# INFINITY6B0 advertises has_defog / has_sinter / has_temper / has_ae_comp /
# has_max_gain as false, so isp_set_* returns RSS_ERR_NOTSUP and rvd logs it
# at info and moves on. The sensor tuning binary stays in charge, which is
# the correct image -- just not an adjustable one.
#
# The flags are false because raptor reaches these knobs by poking a field at
# a hardcoded (payload size, manual offset) pair inside an opaque MI IQ
# struct, and those offsets were read out of an INFINITY6E libmi_isp.so.
# They describe that library build rather than the MI API, and a wrong offset
# does not fail: access is read-modify-write, so it lands a plausible value
# in the wrong field and the image quietly degrades. Deriving the correct
# offsets needs only the library, not a board:
#
#   arm-openipc-linux-musleabihf-objdump -d \
#       --disassemble=MI_ISP_IQ_GetBrightness libmi_isp.so
#
# prints the payload size into the size slot. If the five match INFINITY6E's,
# the flags can be turned on in hal_caps.c and this section becomes live.

[jpeg]
# Off, and on this board that is a memory decision rather than a capability
# one. MJPEG works -- it is I6_VENC_CODEC_MJPG, a real VENC channel -- and
# the encode cost is genuinely small, because the backend gives a JPEG stream
# its own VPE output port bound at the JPEG fps against the sensor's, so MI
# drops the surplus frames in hardware. (INFINITY6E does not set .jpeg_pulse,
# so rvd's software duty-cycling is off here and that hardware pacing is what
# replaces it.)
#
# The cost that bites is the port, not the encoding. A dedicated VPE output
# port is allocated by resolution at queue depth 3, independent of fps, so a
# 1 fps JPEG stream at full 3M still reserves about 12.8 MB of a pool that
# has roughly 4 MB spare. It does not fit.
#
# What does fit is a JPEG stream at sub-stream resolution: 640x360 costs
# about 1.2 MB. If snapshots are wanted, that is the shape to ask for.
#
# The same arithmetic applies to /snap: a full-resolution snapshot port at
# STAR_VPE_SNAP_QUEUE_DEPTH adds ~8.5 MB and will not fit either. Snapshots
# at sub-stream resolution will.
#
# There are four VPE output ports in total, and main + sub already hold two.
enabled = false

[audio]
# Not brought up on this board. Enabling rad also pulls in libmi_ai, and
# nothing here has confirmed what the KD110 v2 has fitted.
enabled = false

[rtsp]
enabled = true
port = 554
# Lower than the SSC30KQ's 4. Each client costs userspace, and this board has
# about 5 MB of it while streaming.
max_clients = 2
# A new viewer forces a keyframe rather than waiting up to a GOP for one.
idr_on_join = true

[http]
enabled = false

[webrtc]
enabled = false

[recording]
enabled = false

[motion]
enabled = false

[rvd]
# Single core. Do not pin rvd and rsd to different CPUs -- the second
# affinity would be invalid and there is nothing to gain.

[log]
# syslog rather than stderr: the init script starts daemons with
# start-stop-daemon -b, so stderr goes nowhere and a stderr target loses the
# log entirely. Read it with `logread`.
#
# info rather than debug, because several daemons at debug will flood a soak
# on a board this size. To diagnose something, stop the service and run the
# one daemon you care about in the foreground with -f -d.
level = info
target = syslog
