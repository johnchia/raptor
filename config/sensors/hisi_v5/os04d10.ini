; os04d10 -- HiSilicon gen5 (hi3516cv6xx) sensor mode
;
; Values from the Hi3516CV610 PQTools config for this sensor. See the
; README beside this file for what each block is and where it came from.


[sensor]
Sensor_type = g_sns_os04d10_obj
DllFile     = libsns_os04d10.so
Mode        = WDR_MODE_NONE

[mode]
input_mode  = INPUT_MODE_MIPI
; One key, not three: the MIPI data type and the VB pixel format are both
; derived from it, and three keys can disagree.
;
; TEN, not the vendor config's twelve. The PQTools file for this sensor sets
; mipi_attr.input_data_type = 2 (RAW12), and its own libsns_os04d10.so has
; exactly one mode -- "os04d10 24Mclk 4M30fps(MIPI) 2LANE_720Mbps 10bit
; linear" -- which emits CSI-2 data type 0x2B. Measured on the bench:
; /proc/umap/mipi_rx reports mipi_ph_d0 = 0x2b (RAW10) whatever the receiver
; is told, and with the receiver on RAW12 no frame ever completes --
; mipi_vc0_w stays 0, lane0_fifo_ovfl climbs, and VI's int_cnt never leaves
; zero. On RAW10 the receiver parses frames immediately.
raw_bitness = 10

[mipi]
; Board wiring, not a sensor property. -1 disables a lane.
;
; 0|2 on the bench board (H4-52POX-S), where the vendor's own config says
; 0|1: the sensor's second data lane is wired to PHY lane 2. Measured --
; with 0|1 the receiver shows cil_d1 IDLE and mipi_vc0_w 0 forever; with
; 0|2 it reports the configured 2304x1296 on the first frame. This is the
; one value in this file that is a property of the *board* rather than of
; the sensor, so a different layout is the first thing to change when a new
; board sees a sensor that initialises but never delivers.
lane_id          = 0|2|-1|-1
lane_divide_mode = 0            ; 0 = one 4-lane receiver, 1 = 2+2
data_rate        = 0            ; MIPI_DATA_RATE_X1

[i2c]
i2c_dev = 0

[isp_image]
Isp_FrameRate = 30
Isp_Bayer     = BAYER_BGGR
Isp_SnsMode   = 0

[vi_dev]
Input_mod  = VI_MODE_MIPI
Work_mod   = VI_WORK_MODE_1Multiplex
Mask_0     = 0xfff00000
Mask_1     = 0x0
Scan_mode  = VI_SCAN_PROGRESSIVE
Data_seq   = VI_DATA_SEQ_YVYU   ; YUV only; carried because the vendor sets it
InputDataType = 0               ; OT_VI_DATA_TYPE_RAW
DataRev    = FALSE
DataRate   = 0                  ; OT_DATA_RATE_X1

; Dead on a MIPI sensor. Carried because skipping them would be a guess
; about which fields the driver reads.
Vsync         = 0
VsyncNeg      = 0
Hsync         = 0
HsyncNeg      = 0
VsyncValid    = 1
VsyncValidNeg = 0
Timingblank_HsyncHfb   = 0
Timingblank_HsyncAct   = 0
Timingblank_HsyncHbb   = 0
Timingblank_VsyncVfb   = 0
Timingblank_VsyncVact  = 0
Timingblank_VsyncVbb   = 0
Timingblank_VsyncVbfb  = 0
Timingblank_VsyncVbact = 0
Timingblank_VsyncVbbb  = 0

; The sensor's output size. Also the MIPI receiver's img_rect and the ISP's
; wnd_rect; the vendor's config repeats it three times and they are equal.
DevRect_x = 0
DevRect_y = 0
DevRect_w = 2560
DevRect_h = 1440

; The CV608 die clocks its ISP at 148.5 MHz against the CV610's 198, so the
; vendor ships a separate config for it at a lower resolution. Only the two
; keys that change are repeated.
;
; This is a crop, not a sensor mode: libsns_os04d10.so has one register set
; and always emits 2560x1440, so the MIPI receiver takes the top-left
; 2304x1296 of it. The vendor's own _3M30_608 config does exactly the same
; thing. Confirmed on the bench -- mipi_vc0_w/h read back 2304x1296 with the
; sensor initialising in its 4M mode.
[vi_dev.hi3516cv608]
DevRect_w = 2304
DevRect_h = 1296
