/* How long an armed button stays armed. Long enough to read the second label
   and mean it, short enough that a click and a walk away is not a restart an
   hour later. */
const CONFIRM_MS = 5000;

/* ═══ live model ═════════════════════════════════════════════════════════ */
let KEYS = [];            /* the schema, as served */
let ACTIONS = [];
/*
 * What the camera says an action's state is, for the few that have one.
 * A segmented action is a view of the daemon, not a record of what was last
 * clicked: `raptorctl ric mode`, MQTT and the automatic switch all move
 * day/night without this page, and the poll below is what notices.
 */
const ACT_STATE = {};
const byId = {};
const V = {};             /* current value per key id */
const SAVED = {};         /* last value known to be on disk */
const CREDSET = {};
const UNSET = new Set();   /* no value from the daemon and none in the file */
/*
 * Keys running on somebody's default rather than on a choice.
 *
 * Not the same as UNSET: a daemon reports the default it resolved in exactly
 * the shape of a configured value, and it is right to -- that is the value in
 * force. rcd says which is which with `configured`, and this is the only thing
 * that can answer whether there is anything to put back.
 */
const DEFAULTED = new Set();
/* Staged for reset. Held here rather than sent, because a reset is restart
 * tier whatever the key is, and the page has one Apply for all of those. */
const RESET = new Set();
const dirty = new Set();
let active = TABS[0].id;
let armed = false;

const id_of = k => k.section + "." + k.key;

/*
 * What restarting a key's owner costs.
 *
 * A live key is published with impact "none", which is true of setting it and
 * false of every other thing that can happen to it: when the platform refuses
 * the live command -- SigmaStar takes orientation at channel creation, so
 * hflip always does -- the edit falls back to the file and the only way to
 * enact it is to restart rvd. Reading "none" then told the operator that
 * applying it costs nothing, in the confirmation step that exists precisely to
 * tell them otherwise. The owner's real cost is in the schema already, carried
 * by its restart-tier keys, so it is derived rather than assumed.
 */
/*
 * What this camera has at all, as opposed to what the table describes.
 *
 * Two different absences, and they need different sources. A key rcd marks
 * `available:false` is one the SoC has no control for -- more than half of
 * [image] on an i6c -- and it is answered from rvd's own vtable. A daemon
 * missing from the build is the other: `hello` reports what is installed, and
 * a section whose owner is not there can be configured but never enacted, so
 * a whole tab of it is worse than useless.
 *
 * Neither is inferred from a failed live command. Orientation is published on
 * SigmaStar and refused while the channel is up; hiding it would delete three
 * working controls.
 */
const MISSING_DAEMON = new Set();
const usable = k => k.available !== false && !MISSING_DAEMON.has(k.owner);

/* ═══ the ISP's own account of its knobs ═════════════════════════════════
 * The schema's bounds on [image] are the widest any platform accepts, and
 * they have to be: the table is compiled into the camera and the real range
 * belongs to the silicon and to the tuning file loaded for this sensor.
 * Brightness is 0-100 on one SoC and a byte on another; 3DNR has eight
 * positions, not 256; exposure compensation is signed. rvd answers all of it
 * per knob and rcd forwards it in `state`, so this page draws the control the
 * hardware actually has instead of a scale somebody agreed on.
 *
 * `auto` is the knobs the ISP is running from the tuning's own curve rather
 * than from a value of ours. Those report the tuner's neutral, which is a
 * real number and indistinguishable from a knob deliberately set there -- so
 * without this list a slider sitting at 50 cannot say whether anyone chose
 * it.
 */
const ISP = {caps: {}, auto: new Set(), live: {}, sig: ""};

/*
 * What this knob accepts here, falling back to the table for a camera that
 * has not said -- rvd down, or a build older than caps. The fallback is the
 * optimistic direction: a control drawn from a range too wide refuses at the
 * edges, where one hidden for want of an answer cannot be used at all.
 *
 * Two different questions about auto, and both have to be yes. The schema
 * says the word is a value for this key at all; caps says this camera's knob
 * has a curve to hand back to. Temporal denoise is the example -- a real knob
 * on every platform, and a VPE level with no tuning behind it, so there is
 * nothing for auto to mean.
 */
function bounds(k) {
  const c = k.section === "image" ? ISP.caps[k.key] : null;
  if (!c) return {min: k.min, max: k.max, neutral: null,
                  auto: k.auto === true, enabled: true};
  return {min: c.min, max: c.max, neutral: c.neutral,
          auto: k.auto === true && c.auto !== false, enabled: c.enabled !== false};
}

/*
 * Whether this knob is following the tuning.
 *
 * A key nobody has configured is: rvd stopped writing [image] keys the config
 * never named, precisely so the tuning's own answer survives a restart. So
 * "unset" and "auto" are the same state here, and the camera's list is what
 * confirms it.
 */
function isAuto(id) {
  const k = byId[id];
  if (!k || k.section !== "image" || !bounds(k).auto) return false;
  if (V[id] === "auto") return true;
  return V[id] === undefined && ISP.auto.has(k.key);
}

/*
 * The number a control shows. For a knob on auto that is the camera's own
 * reading -- the value the picture is at, which is the tuner's and not ours.
 * Drawing an empty slider there would be the one thing that is certainly
 * wrong: the knob has a position, it just has not got one from this page.
 */
function shown(id) {
  const k = byId[id];
  if (typeof V[id] === "number") return V[id];
  if (!k || k.section !== "image") return V[id];
  if (typeof ISP.live[k.key] === "number") return ISP.live[k.key];
  const b = bounds(k);
  return b.neutral !== null ? b.neutral : b.min;
}

const OWNER_IMPACT = {};
function learnImpacts() {
  KEYS.forEach(k => {
    if (k.tier !== "live" && k.impact && k.impact !== "none") OWNER_IMPACT[k.owner] = k.impact;
  });
}
const costOf = k => (k.impact && k.impact !== "none") ? k.impact
                  : (OWNER_IMPACT[k.owner] || "service");

/* ═══ widget choice — from the schema alone ══════════════════════════════
   With one exception the control follows from the type and the range. The
   exception is that a range says nothing about whether the numbers in it are
   quantities or names: a GPIO is picked from a wiring diagram and never
   nudged, so a slider over it is an invitation to sweep every pin on the SoC
   looking for the one that moves the filter. Identity keys get a plain field.
   This is presentation, so it belongs here rather than in rcd's table. */
const IDENTIFIER = /^(gpio_|adc_channel$)/;
function isIdentifier(k) { return IDENTIFIER.test(k.key); }

function widgetFor(k) {
  if (k.type === "bool") return "switch";
  if (k.type === "credential") return "cred";
  /* Everything with a length rather than a range. A V_TEXT carries max_length
     and no bounds at all, so without this it falls past every span test below
     and lands on the number widget -- which is what the wifi SSID had been
     getting. */
  if (k.type === "host" || k.type === "ipv4" || k.type === "text") return "text";
  if (k.type === "enum") return (k.choices || []).length <= 4 ? "seg" : "select";
  if (k.labels) return k.labels.length <= 4 ? "seg" : "select";
  const b = bounds(k);
  const span = b.max - b.min;
  if (span === 1) return "switch";
  if (isIdentifier(k)) return "number";
  if (span <= 4) return "seg";
  if (span <= 1000) return "slider";
  return "number";
}
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

/* A labelled integer shows its name and is sent as its name; rcd maps it back
 * to the number, which is what the file and the daemons want. */
const labelOf = (k, v) => (k.labels && k.labels[v - k.min] !== undefined)
  ? k.labels[v - k.min] : String(v);
const valueOf = (k, name) => k.labels ? k.min + k.labels.indexOf(name) : name;

/* ═══ reset ══════════════════════════════════════════════════════════════
   Putting a key back means removing it, not writing a default over it: the
   default is the argument at the read site inside the daemon that owns the
   key, and nothing here has a copy of it. So this page cannot show what the
   value will become -- only that it will be the daemon's. It says that rather
   than guessing, and the field fills in for real after the restart.

   Staged like every other restart-tier change and sent by Apply, because that
   is what a reset is however live the key is when it carries a value. */
const canReset = id => byId[id] && byId[id].resettable !== false &&
                       byId[id].type !== "credential" &&
                       (!DEFAULTED.has(id) || RESET.has(id));

function toggleReset(id, on) {
  if (on === undefined) on = !RESET.has(id);
  if (on) { RESET.add(id); dirty.add(id); }
  else {
    RESET.delete(id);
    if (JSON.stringify(V[id]) === JSON.stringify(SAVED[id])) dirty.delete(id);
  }
}

/* A whole group at once. The caller passes only the keys that have something
   to put back -- most of a group is already at its default, and staging those
   would ask for a restart to change nothing. */
function resetKeys(ids) {
  if (!ids.length) { wlog("sys", "nothing here to put back"); return; }
  ids.forEach(id => toggleReset(id, true));
  refreshBar(); render();
  wlog("sys", "staged " + ids.length + " key" + (ids.length === 1 ? "" : "s") +
              " for reset — Apply puts them back");
}

/* Two buttons, not one taking either kind of argument: one key id and a list
   of them are told apart only by how many were passed, which is a guess that
   was wrong for every group holding exactly one key. */
function undoButton(label, title, onClick) {
  const b = document.createElement("button");
  b.className = "undo"; b.type = "button";
  b.textContent = label;
  b.title = title;
  b.addEventListener("click", onClick);
  return b;
}

function keyUndoButton(id) {
  return undoButton(
    RESET.has(id) ? "keep the reset" : "reset",
    "Take this key out of the configuration and let " +
      ((byId[id] && byId[id].owner) || "the camera") + " use its own default",
    () => { toggleReset(id); refreshBar(); render(); });
}

/* Scoped to the rows the group draws rather than to its section: a section
   split across two groups has a reset button on each, and neither may reach
   into the other. */
function groupUndoButton(ids) {
  return undoButton("reset group", "Put every key in this group back to its default",
                    () => resetKeys(ids));
}

/* ═══ committing ═════════════════════════════════════════════════════════
   One request per key at a time, and the newest value always wins.

   A number spinner held down fires a change per click, each one a round trip
   to the daemon. Sent as they come, the replies race: an older one lands after
   a newer click and writes the device's answer back over the value the
   operator has just chosen, which reads as a control that sticks and drops
   inputs. So a key with a request in flight parks the latest value instead of
   sending it, and the reply is only written back into the control when nothing
   is parked behind it -- otherwise the parked value is about to be sent and
   would be overwritten by a reading it predates. */
const inflight = new Set();
const parked = {};

async function commit(id, val, el) {
  const k = byId[id];
  const prev = V[id];
  V[id] = val;
  /* Typing into a field the operator has just asked to put back means they
     changed their mind about the reset, not that they want both. */
  RESET.delete(id);

  if (k.tier === "live" && k.type !== "credential") {
    if (inflight.has(id)) { parked[id] = {val: val, el: el}; return; }
    inflight.add(id);
    try {
      await commitLive(id, val, el, prev);
    } finally {
      inflight.delete(id);
      const q = parked[id];
      if (q) { delete parked[id]; commit(id, q.val, q.el); }
    }
    return;
  }

  if (k.type === "credential") {
    try {
      /* rcd writes [rtsp] and [http] from one value, so the camera has one
         account; the field it takes is the bare key, not a section. */
      await api({cmd:"credentials", [k.key]: val});
      CREDSET[id] = true;
      mark(el, "set");
    } catch (e) { V[id] = prev; mark(el, e.message, true); }
    return;
  }

  if (JSON.stringify(val) === JSON.stringify(SAVED[id])) dirty.delete(id);
  else dirty.add(id);
  if (el) el.classList.toggle("dirty", dirty.has(id));
  refreshBar();
}

/* `prev` is passed in: V[id] has already been moved to the new value so the
 * control reflects the click at once, and the error path needs what it was
 * before that. */
async function commitLive(id, val, el, prev) {
  const k = byId[id];
  const wire = k.labels ? labelOf(k, val) : val;
  try {
    const r = await api({cmd:"set", edits:[{section:k.section, key:k.key, value:wire}]});
    const res = (r.results || [])[0] || {};
    /* The device's answer wins over what was typed: an ISP quantises, and a
     * live command that was refused falls back to the file and says so. */
    if (res.value !== undefined && res.value !== null) {
      V[id] = k.labels && typeof res.value === "string" ? valueOf(k, res.value) : res.value;
      if (!parked[id]) syncControl(el, k, V[id]);
    }
    if (res.applied === "saved") {
      dirty.add(id);
      if (el) {
        el.classList.add("dirty");
        /* The badge said "live" a moment ago and is now wrong. */
        const c = el.querySelector(".chip");
        if (c) { c.className = "chip " + costOf(k); c.textContent = costOf(k);
                 c.title = "Needs " + k.owner + " restarted — " + COST[costOf(k)]; }
      }
      mark(el, res.note || "saved — needs apply", true);
      refreshBar();
    } else {
      /* rcd's own words when it has any: a stored value that nothing has
         read yet says so, and "applied" would be a smaller truth. */
      mark(el, res.note ? res.note
                        : (V[id] !== val ? "device " + labelOf(k, V[id]) : "applied"),
           false, V[id] !== val);
      if (el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
    }
  } catch (e) {
    V[id] = prev;
    if (!parked[id]) syncControl(el, k, prev);
    mark(el, e.message, true);
  }
}

function mark(el, text, warn, bold) {
  if (!el) return;
  const rb = el.querySelector(".readback");
  if (!rb) return;
  rb.classList.toggle("warn", !!warn);
  if (bold) { rb.innerHTML = ""; const b = document.createElement("b"); b.textContent = text; rb.append(b); }
  else rb.textContent = text;
}
function syncControl(el, k, val) {
  if (!el) return;
  /* "auto" is not a position on the scale, so the slider keeps showing where
     the camera says the picture is and the button carries the state. */
  const on = val === "auto";
  const num = on ? shown(id_of(k)) : val;
  const row = el.querySelector(".sl");
  if (row) row.classList.toggle("auto", on);
  const ab = el.querySelector(".autobtn");
  if (ab) ab.setAttribute("aria-pressed", String(on));
  const sl = el.querySelector("input[type=range]");
  if (sl && num !== undefined) sl.value = num;
  const nm = el.querySelector(".num");
  if (nm && num !== undefined) nm.value = num;
  const tx = el.querySelector(".txt");
  if (tx && document.activeElement !== tx) tx.value = val === undefined || val === null ? "" : val;

  /* A named value rather than a magnitude, drawn as a select or a segmented
     control. Both are put back from the same display form buildControl drew
     them with -- without this a live command the camera refused leaves the
     control showing the choice that was refused, which is the one thing it
     must never do. */
  const name = k.type === "enum" ? val : (k.labels ? labelOf(k, val) : undefined);
  if (name === undefined || name === null) return;
  const sel = el.querySelector("select");
  if (sel) {
    sel.value = name;
    sel.querySelectorAll("option").forEach(o => { o.selected = o.value === name; });
  }
  const sg = el.querySelector(".seg");
  if (sg) sg.querySelectorAll("button").forEach(
    b => b.setAttribute("aria-pressed", String(b.textContent === name)));
}

/* ═══ controls ═══════════════════════════════════════════════════════════ */
function buildControl(id, onChange) {
  const k = byId[id], w = widgetFor(k), wrap = document.createElement("div");
  wrap.className = "ctl";
  const u = unit(id);

  if (w === "switch") {
    const isInt = k.type === "int";
    const lab = document.createElement("label"); lab.className = "sw";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!V[id];
    const tr = document.createElement("span"); tr.className = "track";
    const tx = document.createElement("span"); tx.className = "lbl";
    tx.textContent = cb.checked ? "on" : "off";
    cb.addEventListener("change", () => {
      tx.textContent = cb.checked ? "on" : "off";
      onChange(isInt ? (cb.checked ? 1 : 0) : cb.checked);
    });
    lab.append(cb, tr, tx); wrap.append(lab); return wrap;
  }

  if (w === "seg" || w === "select") {
    const opts = k.type === "enum" ? (k.choices || [])
               : k.labels ? k.labels
               : Array.from({length: k.max - k.min + 1}, (_, i) => String(k.min + i));
    const cur = k.type === "enum" ? V[id] : (k.labels ? labelOf(k, V[id]) : String(V[id]));
    const send = o => onChange(k.type === "enum" ? o : (k.labels ? valueOf(k, o) : Number(o)));
    if (w === "select") {
      const s = document.createElement("select");
      opts.forEach(o => {
        const op = document.createElement("option"); op.value = op.textContent = o;
        if (cur === o) op.selected = true; s.append(op);
      });
      s.addEventListener("change", () => send(s.value));
      wrap.append(s); return wrap;
    }
    const seg = document.createElement("div"); seg.className = "seg";
    opts.forEach(o => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = o;
      b.setAttribute("aria-pressed", String(cur === o));
      b.addEventListener("click", () => {
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        send(o);
      });
      seg.append(b);
    });
    wrap.append(seg); return wrap;
  }

  if (w === "cred") {
    const box = document.createElement("div"); box.className = "cred";
    const inp = document.createElement("input");
    inp.type = /password/.test(k.key) ? "password" : "text";
    inp.placeholder = CREDSET[id] ? "unchanged" : "not set";
    inp.autocomplete = "off";
    const st = document.createElement("span"); st.className = "state";
    st.textContent = CREDSET[id] ? "set" : "unset";
    inp.addEventListener("change", () => { if (inp.value) onChange(inp.value); });
    box.append(inp, st); wrap.append(box);
    const n = document.createElement("span"); n.className = "unit";
    n.textContent = "write-only · never read back";
    wrap.append(n); return wrap;
  }

  if (w === "text") {
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "txt";
    inp.value = V[id] === undefined || V[id] === null ? "" : V[id];
    inp.maxLength = k.max_length || 63;
    inp.spellcheck = false; inp.autocapitalize = "off"; inp.autocomplete = "off";
    inp.addEventListener("change", () => onChange(inp.value.trim()));
    wrap.append(inp); return wrap;
  }

  const b = bounds(k);

  if (w === "slider") {
    const row = document.createElement("div"); row.className = "sl";
    const sl = document.createElement("input"); sl.type = "range";
    sl.min = b.min; sl.max = b.max; sl.value = shown(id);
    const nm = document.createElement("input"); nm.className = "num"; nm.type = "number";
    nm.min = b.min; nm.max = b.max; nm.value = shown(id);
    const send = v => {
      const c = clamp(id, b, v);
      sl.value = c; nm.value = c;
      onChange(c);
    };
    sl.addEventListener("input", () => { nm.value = sl.value; });
    sl.addEventListener("change", () => send(Number(sl.value)));
    nm.addEventListener("change", () => send(Number(nm.value)));
    if (b.auto) row.append(autoButton(id, row, onChange));
    row.append(sl, nm);
    if (u) { const us = document.createElement("span"); us.className = "unit"; us.textContent = u; row.append(us); }
    row.classList.toggle("auto", isAuto(id));
    wrap.append(row);
    wrap.append(rangeHint(b));
    if (!b.enabled) wrap.append(moduleOff());
    return wrap;
  }

  const box = document.createElement("div"); box.className = "numwrap";
  const nm = document.createElement("input"); nm.className = "num wide"; nm.type = "number";
  nm.min = b.min; nm.max = b.max; nm.value = shown(id);
  const us = document.createElement("span"); us.className = "unit"; us.textContent = u;
  nm.addEventListener("change", () => {
    const c = clamp(id, b, Number(nm.value));
    nm.value = c;
    onChange(c);
  });
  box.append(nm, us); wrap.append(box);
  const hint = document.createElement("span"); hint.className = "unit";
  hint.textContent = fmt(b.min) + " – " + fmt(b.max); wrap.append(hint);
  return wrap;
}

/*
 * A typed number the camera cannot take, held to what it can.
 *
 * A refused live command falls back to the file and asks for a restart, which
 * is right for a key the running channel will not take now and wrong for one
 * no channel will ever take: it stages an edit that cannot be enacted and
 * charges a pipeline restart to find that out. The page knows the range --
 * for the ISP it is the camera's own, published beside the value -- so it
 * says so here instead, in the log, where an unexplained number lands next to
 * the request that caused it.
 */
function clamp(id, b, v) {
  if (!isFinite(v)) return b.min;
  const c = Math.min(b.max, Math.max(b.min, v));
  if (c !== v)
    wlog("sys", id + ": " + v + " is outside what this camera takes (" +
                b.min + "–" + b.max + "), sent " + c);
  return c;
}

/*
 * Hand the knob back to the tuning, or take it. Pressed means the ISP is
 * following its own curve; pressing it again pins the knob where it is now,
 * which is the tuner's neutral and a value somebody may well want fixed.
 *
 * The word goes to the camera as the word. It is not a number on this scale
 * and cannot be one: the scale says how much, and this says who decides.
 */
function autoButton(id, row, onChange) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "autobtn"; b.textContent = "auto";
  b.title = "Follow the tuning file's own curve for this knob, which varies " +
            "it with the light, instead of holding one value";
  b.setAttribute("aria-pressed", String(isAuto(id)));
  b.addEventListener("click", () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", String(on));
    row.classList.toggle("auto", on);
    onChange(on ? "auto" : Number(shown(id)));
  });
  return b;
}

/*
 * The range, and where the tuning sits inside it. The neutral is not the
 * midpoint on every knob -- MI's unity for a saturation field is 32 of 127,
 * and Ingenic's highlight suppression is off at 0 -- so a reader guessing
 * from the ends alone would guess wrong on exactly the knobs that matter.
 */
function rangeHint(b) {
  const s = document.createElement("span"); s.className = "unit";
  s.textContent = fmt(b.min) + "–" + fmt(b.max) +
    (b.neutral === null ? "" : " · tuning " + fmt(b.neutral));
  return s;
}

/* A module the tuning binary ships switched off -- Infinity6C's imx335 does
 * this to Brightness. Setting a value switches it on, so the control works;
 * what the operator is being told is that using it departs from the tuning by
 * more than the number suggests, and that `auto` is the way back. The note
 * clears itself once the module is on, which is the state the camera then
 * reports. */
function moduleOff() {
  const s = document.createElement("span"); s.className = "modoff";
  s.textContent = "the tuning ships this module off — setting a value switches it on";
  return s;
}

const COST = {
  none:"nothing is interrupted",
  service:"nothing a viewer notices",
  stream:"connected viewers are dropped",
  pipeline:"capture stops, everything downstream reconnects",
  network:"every connection to the camera drops, including this page",
  reboot:"the camera has to restart before anything reads it"
};
/* Two different questions, and a key can answer them differently. The tier
   says whether anything is owed to Apply; the impact says what it costs to be
   in force. The timezone is the one that separates them: it is stored the
   moment it is set, so Apply has nothing to do, and nothing running reads it
   until the camera comes back. */
function chip(k) {
  const c = document.createElement("span");
  if (k.tier === "live" && k.impact && k.impact !== "none") {
    c.className = "chip " + k.impact; c.textContent = k.impact;
    c.title = "Stored at once — " + COST[k.impact];
  } else if (k.tier === "live") {
    c.className = "chip live"; c.textContent = "live";
    c.title = "Applied to " + k.owner + " the moment you change it";
  } else {
    c.className = "chip " + k.impact; c.textContent = k.impact;
    c.title = "Needs " + k.owner + " restarted — " + COST[k.impact];
  }
  if (k.guard_sec) c.title += ". Reverts in " + k.guard_sec + " s unless you confirm";
  return c;
}

function buildRow(id) {
  const k = byId[id];
  const row = document.createElement("div"); row.className = "row"; row.dataset.id = id;
  if (dirty.has(id)) row.classList.add("dirty");
  if (RESET.has(id)) row.classList.add("resetting");
  const lab = document.createElement("div"); lab.className = "lab";
  const nm = document.createElement("span"); nm.className = "name"; nm.textContent = label(id);
  const idl = document.createElement("span"); idl.className = "id"; idl.textContent = id;
  lab.append(nm, idl);
  const h = help(id);
  if (h) { const p = document.createElement("p"); p.className = "help"; p.textContent = h; lab.append(p); }
  const ctl = buildControl(id, v => commit(id, v, row));
  const mk = document.createElement("div"); mk.className = "mark";
  mk.append(chip(k));
  const rb = document.createElement("span"); rb.className = "readback";
  if (RESET.has(id)) rb.textContent = "default after apply";
  /* Ahead of "not set", and it is why the knob is not set: the tuning owns
     it, which is a state the camera is in rather than a gap in the file. */
  else if (isAuto(id)) rb.textContent = "from the tuning";
  else if (UNSET.has(id)) rb.textContent = "not set";
  else if (DEFAULTED.has(id)) rb.textContent = "default";
  mk.append(rb);
  if (canReset(id)) mk.append(keyUndoButton(id));
  row.append(lab, ctl, mk);
  return row;
}

/* Both encoders take the same keys, so they are one table with a column each
 * rather than two lists of ten. */
function buildMatrix(sections) {
  const t = document.createElement("table"); t.className = "matrix";
  const hr = document.createElement("tr"); hr.append(document.createElement("th"));
  sections.forEach(s => {
    const th = document.createElement("th");
    th.append(document.createTextNode(s === sections[0] ? "Main" : "Sub"));
    const res = document.createElement("span"); res.className = "res";
    res.textContent = (V[s + ".width"] || "?") + "×" + (V[s + ".height"] || "?") + " · " + s;
    th.append(res); hr.append(th);
  });
  const head = document.createElement("thead"); head.append(hr); t.append(head);

  const body = document.createElement("tbody");
  const keys = [];
  KEYS.forEach(k => { if (sections.includes(k.section) && !keys.includes(k.key)) keys.push(k.key); });
  keys.forEach(key => {
    const tr = document.createElement("tr");
    const kd = document.createElement("td"); kd.className = "k";
    const anyId = sections.map(s => s + "." + key).find(i => byId[i]);
    const nm = document.createElement("div"); nm.textContent = label(anyId);
    const il = document.createElement("div"); il.className = "id"; il.textContent = "*." + key;
    kd.append(nm, il);
    /* The label is the only place a matrix key can be explained: a cell holds
       one control per stream and has no room beside it. */
    const kh = help(anyId);
    if (kh) { const p = document.createElement("p"); p.className = "help"; p.textContent = kh;
      kd.append(p); }
    tr.append(kd);
    sections.forEach(s => {
      const id = s + "." + key, td = document.createElement("td"); td.className = "cell";
      if (!byId[id]) { const u = document.createElement("span"); u.className = "unit";
        u.textContent = "—"; td.append(u); tr.append(td); return; }
      if (dirty.has(id)) td.classList.add("dirty");
      if (RESET.has(id)) td.classList.add("resetting");
      const box = document.createElement("div"); box.className = "cellbox";
      const foot = document.createElement("div"); foot.className = "cellfoot";
      foot.append(chip(byId[id]));
      const rb = document.createElement("span"); rb.className = "readback";
      if (RESET.has(id)) rb.textContent = "default";
      else if (DEFAULTED.has(id)) rb.textContent = "default";
      foot.append(rb);
      if (canReset(id)) foot.append(keyUndoButton(id));
      box.append(buildControl(id, v => commit(id, v, td)), foot);
      td.append(box); tr.append(td);
    });
    body.append(tr);
  });
  t.append(body); return t;
}

const SEGS = {};          /* the segmented control per action, as last drawn */

/* Press the button that matches `value`, if that segment has been drawn. */
function segShow(action, value) {
  const seg = SEGS[action];
  if (!seg) return;
  seg.querySelectorAll("button").forEach(
    b => b.setAttribute("aria-pressed", String(b.dataset.choice === value)));
}

function buildActions(names) {
  const box = document.createElement("div"); box.className = "acts";
  names.forEach(n => {
    const meta = ACTIONS.find(a => a.name === n);
    if (!meta) return;                      /* the daemon does not offer it */
    const ui = ACTION_UI[n] || {label: pretty(n)};
    const arg = (meta.args || []).find(a => a.type === "enum");
    /* Said by the schema, not by this file: an action whose answer is not
       "now" carries the one sentence that explains it. */
    const note = () => { if (!meta.note) return;
      const p = document.createElement("p"); p.className = "help";
      p.textContent = meta.note; box.append(p); };
    if (arg && arg.choices && !ui.toggle) {
      const lab = document.createElement("span"); lab.className = "unit"; lab.textContent = ui.label;
      const seg = document.createElement("div"); seg.className = "seg";
      seg.dataset.act = n; SEGS[n] = seg;
      arg.choices.forEach(c => {
        const b = document.createElement("button"); b.type = "button"; b.textContent = c;
        b.dataset.choice = c;
        b.addEventListener("click", async () => {
          segShow(n, c);                       /* answer the click at once */
          if (!await fire(n, {[arg.key]: c}))  /* refused: show what is true */
            segShow(n, ACT_STATE[n]);
        });
        seg.append(b);
      });
      segShow(n, ACT_STATE[n]);
      box.append(lab, seg); note();
    } else if (ui.toggle && arg) {
      const b = document.createElement("button"); b.className = "btn"; b.textContent = ui.label;
      let on = false;
      b.addEventListener("click", () => {
        on = !on; b.classList.toggle("on", on);
        fire(n, {[arg.key]: on ? "on" : "off"});
      });
      box.append(b); note();
    } else if (ui.confirm) {
      /*
       * Two clicks, because the first one is how you find out what the button
       * does. The armed state disarms itself: a button left saying "click
       * again" is a trap for whoever walks up to the page next.
       */
      const b = document.createElement("button"); b.className = "btn"; b.textContent = ui.label;
      /* Armed is its own flag rather than the timer's id: a timer id is only
         required to be unique, not to be truthy. */
      let armed = false, timer = null;
      const disarm = () => {
        armed = false;
        if (timer !== null) { clearTimeout(timer); timer = null; }
        b.classList.remove("danger"); b.textContent = ui.label;
      };
      b.addEventListener("click", () => {
        if (armed) { disarm(); fire(n, null); return; }
        armed = true;
        b.classList.add("danger"); b.textContent = ui.confirm;
        timer = setTimeout(disarm, CONFIRM_MS);
      });
      box.append(b); note();
    } else {
      const b = document.createElement("button"); b.className = "btn"; b.textContent = ui.label;
      b.addEventListener("click", () => fire(n, null));
      box.append(b); note();
    }
  });
  return box;
}

/*
 * rcd reads the verb out of `action`, not out of `name` -- `name` is what the
 * schema calls the field it emits, and sending that back is a malformed
 * request, not an unknown action. Returns whether the camera took it, so a
 * control that latched on the click can un-latch when it did not.
 */
async function fire(name, args) {
  try { await api(Object.assign({cmd:"action", action:name}, args || {})); return true; }
  catch (e) { wlog("err", "! " + name + ": " + e.message); return false; }
}

/* ═══ render ═════════════════════════════════════════════════════════════ */
function claimedSections() {
  const s = [];
  TABS.forEach(t => t.groups.forEach(g => {
    if (g.matrix) s.push(...g.matrix); else if (g.section) s.push(g.section);
  }));
  return s;
}
function tabSections(t) {
  return t.groups.flatMap(g => g.matrix ? g.matrix : (g.section ? [g.section] : []));
}
/*
 * Key names a sibling group on this page has claimed by name.
 *
 * A group that names its keys renders exactly those, and the group that takes
 * the whole section renders what is left -- so a key added to the schema turns
 * up without this file being told about it, the same way a section no tab
 * claims still gets a page.
 */
function claimedKeys(tab, section) {
  const s = new Set();
  tab.groups.forEach(g => { if (g.section === section && g.keys) g.keys.forEach(k => s.add(k)); });
  return s;
}
function groupRows(tab, g) {
  if (!g.section) return [];
  const all = KEYS.filter(k => k.section === g.section);
  if (!g.keys) {
    const claimed = claimedKeys(tab, g.section);
    return all.filter(k => !claimed.has(k.key));
  }
  /* Named order, and a name this build has no key for is simply absent. */
  return g.keys.map(n => all.find(k => k.key === n)).filter(Boolean);
}

/*
 * Which trigger consults a key, for the keys only one of them does.
 *
 * Each trigger reaches its verdict from its own readings and reads only its
 * own thresholds -- the luma pair is not a fallback the others share. Drawing
 * one the running trigger ignores invites it to be tuned and wondered about.
 *
 * A prefix carries the adc and photo sets; the rest are named, because
 * `night_gain` and `night_threshold` are the same question asked by different
 * triggers and nothing in the spelling says which.
 */
const IRCUT_TRIGGER_ONLY = {
  night_luma: "luma",
  night_gain: "luma",
  day_gain_pct: "luma",
  night_threshold: "gain",
  day_threshold: "gain",
};
function ircutVisible(key) {
  const t = V["ircut.trigger"];
  if (key.startsWith("adc_")) return t === "adc";
  if (key.startsWith("photo_")) return t === "photo";
  /* The photo trigger runs its own state machine and never debounces. */
  if (key === "hysteresis_sec") return t !== "photo";
  return !IRCUT_TRIGGER_ONLY[key] || IRCUT_TRIGGER_ONLY[key] === t;
}

function render() {
  const sheet = document.getElementById("sheet");
  sheet.textContent = "";
  const tab = TABS.find(t => t.id === active);

  /*
   * What can be done now sits above what can be configured. A stable sort, so
   * the groups keep the order they are written in within each half -- this
   * decides which half, and nothing else.
   */
  const groups = tab.groups.slice().sort((a, b) => (b.actions ? 1 : 0) - (a.actions ? 1 : 0));

  groups.forEach(g => {
    /* Filtered once, so what the group's reset button puts back is exactly
       what it drew -- a trigger's keys are not staged from a page that is not
       showing them. */
    const rows = groupRows(tab, g)
                   .filter(k => k.section !== "ircut" || ircutVisible(k.key));
    if (g.section && !rows.length) return;      /* section the build left out */
    const sec = document.createElement("section"); sec.className = "group";
    const h = document.createElement("h3");
    h.append(document.createTextNode(g.title));
    if (g.note) { const n = document.createElement("span"); n.className = "note";
      n.textContent = g.note; h.append(n); }
    const resettable = (g.matrix ? KEYS.filter(k => g.matrix.includes(k.section)) : rows)
                         .map(id_of).filter(id => canReset(id) && !DEFAULTED.has(id));
    if (resettable.length) h.append(groupUndoButton(resettable));
    const own = document.createElement("span"); own.className = "owner";
    own.textContent = g.matrix ? (byId[g.matrix[0] + ".width"] || {}).owner || ""
                   : (rows[0] ? rows[0].owner : "");
    h.append(own); sec.append(h);

    if (g.matrix) sec.append(buildMatrix(g.matrix));
    else if (g.actions) sec.append(buildActions(g.actions));
    else rows.forEach(k => sec.append(buildRow(id_of(k))));
    sheet.append(sec);
  });

  const f = document.createElement("p"); f.className = "foot";
  f.textContent = "rcd serves " + KEYS.length + " typed keys and " + ACTIONS.length +
    " actions as one flat array — no grouping, no wording, no layout. Everything above is this "+
    "page reading that array.";
  sheet.append(f);
  paintTabs();
}

function paintTabs() {
  document.querySelectorAll(".tab").forEach(el => {
    const t = TABS.find(x => x.id === el.dataset.id);
    const secs = tabSections(t);
    el.classList.toggle("has-dirty", [...dirty].some(d => secs.includes(sect_of(d))));
    el.setAttribute("aria-selected", String(el.dataset.id === active));
  });
}

/* ═══ apply ══════════════════════════════════════════════════════════════ */
const RANK = {service:1, stream:2, pipeline:3, network:4};
const bar = document.getElementById("applybar");
const btnApply = document.getElementById("btnApply");

function refreshBar() {
  const n = dirty.size;
  bar.hidden = n === 0;
  armed = false; btnApply.className = "btn primary"; btnApply.textContent = "Apply";
  paintTabs();
  if (!n) return;
  const worst = worstCost();
  const owners = [...new Set([...dirty].map(id => byId[id].owner))];
  const daemons = owners.filter(o => o !== "system");
  document.getElementById("apCount").textContent = n + (n === 1 ? " change pending" : " changes pending");
  /* "system" is not a daemon and cannot be restarted; what happens to those
     keys is that the camera enacts them, which is a different sentence. */
  const what = [daemons.length ? "Restarts " + daemons.join(", ") : null,
                owners.includes("system") ? "changes the camera itself" : null]
               .filter(Boolean).join(", ");
  document.getElementById("apCost").textContent =
    what.charAt(0).toUpperCase() + what.slice(1) + " — " + COST[worst] + ".";
  const kb = document.getElementById("apKeys"); kb.textContent = "";
  [...dirty].slice(0, 5).forEach(id => {
    const c = document.createElement("code"); c.textContent = id; kb.append(c);
  });
  if (n > 5) { const c = document.createElement("code"); c.textContent = "+" + (n - 5) + " more"; kb.append(c); }
  if (worst === "pipeline" || worst === "network") btnApply.className = "btn danger";
}

function worstCost() {
  return [...dirty].map(id => costOf(byId[id]))
                   .reduce((a, b) => RANK[b] > RANK[a] ? b : a, "service");
}

btnApply.addEventListener("click", async () => {
  const worst = worstCost();
  if (worst !== "service" && !armed) {
    armed = true;
    btnApply.textContent = worst === "network" ? "Confirm — changes the address"
                         : worst === "pipeline" ? "Confirm — stops capture"
                         : "Confirm — drops viewers";
    return;
  }
  await doApply(worst);
});

document.getElementById("btnRevert").addEventListener("click", async () => {
  /* Ask rcd what is on disk rather than trusting this page's memory of it. */
  dirty.clear();
  RESET.clear();
  await loadValues();
  refreshBar(); render();
  wlog("sys", "reverted to the saved configuration");
});

async function doApply(worst) {
  const edits = [...dirty].map(id => {
    const k = byId[id];
    /* null is the whole request: take this key out and let its owner's own
       default answer for it again. */
    if (RESET.has(id)) return {section: k.section, key: k.key, value: null};
    return {section: k.section, key: k.key, value: k.labels ? labelOf(k, V[id]) : V[id]};
  });
  btnApply.disabled = true; document.getElementById("btnRevert").disabled = true;
  const screen = document.getElementById("screen");
  const cam = document.getElementById("cam");
  try {
    /*
     * The reply says, per edit, whether anything is now owed to the apply.
     * An edit that found the setting the way it was asking for it is not --
     * a reset of a key already at its default is the ordinary case of that,
     * and treating it as a change would send this page looking for a camera
     * that never went anywhere.
     */
    let moved = new Set(dirty);
    if (edits.length) {
      const r = await api({cmd:"set", edits: edits});
      moved = new Set((r.results || []).filter(x => x.applied === "saved")
                                       .map(x => x.section + "." + x.key));
    }
    if (worst === "pipeline") { screen.classList.add("busy"); cam.removeAttribute("src"); }

    /*
     * A guarded key changes the way back to the camera, so the reply to this
     * apply is not waited for: on an address change the socket is gone before
     * rcd can write it. The apply is sent, and then this page goes looking.
     */
    const guarded = [...moved].filter(id => byId[id] && byId[id].guard_sec);
    if (guarded.length) {
      const target = reconnectTarget(guarded);
      dirty.forEach(id => SAVED[id] = V[id]); dirty.clear(); RESET.clear();
      api({cmd:"apply"}).then(noteGuard).catch(() => {});
      await reconnect(target);
      return;
    }

    await api({cmd:"apply"});
    dirty.forEach(id => SAVED[id] = V[id]); dirty.clear(); RESET.clear();
    /* What the reset keys now read as comes from the daemons that own them,
       and only after the restart above -- there was never a value here to
       write into the fields. */
    await loadValues();
  } catch (e) {
    wlog("err", "! apply: " + e.message);
    banner("The apply did not finish", e.message);
  } finally {
    btnApply.disabled = false; document.getElementById("btnRevert").disabled = false;
    screen.classList.remove("busy");
    /*
     * Twice, and the second one is the one that matters. An <img> showing a
     * multipart stream that ends does not fire `error` -- it keeps the last
     * frame it painted and says nothing -- so a restart leaves the picture
     * looking live and stale, which is worse than a blank. The first attach
     * happens now; the second is after the ring has had time to refill, since
     * rcd reports the apply done when rvd is up rather than when it is
     * producing.
     */
    startPreview();
    setTimeout(() => startPreview(), 2500);
    refreshBar(); render();
    loadState();
  }
}

/* ═══ confirm-or-revert ══════════════════════════════════════════════════
   A guarded key is applied, never typed into effect: it sits in the apply bar
   with everything else, and pressing Apply is what puts it in force. What
   happens next is the interesting part -- an address change ends this page's
   connection to the camera before the reply to that apply can be written, so
   there is nothing to await and nothing to read.

   So the page does what a person would: it goes looking. It keeps asking the
   camera whether it is there, at the address it knows and then at the address
   it just asked for, and only when the camera answers does it offer to keep
   the change. Confirming a setting you cannot see the effect of is how a
   camera ends up unreachable and confirmed. */
const gbar = document.getElementById("guardbar");
const gdTitle = document.getElementById("gdTitle");
const gdWhat = document.getElementById("gdWhat");
const gdClock = document.getElementById("gdClock");
const btnKeep = document.getElementById("btnGuardKeep");
const btnUndo = document.getElementById("btnGuardUndo");
let guardLeft = 0, guardTick = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));

function guardKeys(keys) {
  const kb = document.getElementById("gdKeys"); kb.textContent = "";
  (keys || []).forEach(k => {
    const c = document.createElement("code"); c.textContent = k.section + "." + k.key; kb.append(c);
  });
}

/* Connected, and the camera is waiting to be told. */
function showGuard(g) {
  guardLeft = g.revert_in_sec || 0;
  gdTitle.textContent = "Still there? Confirm before this runs out";
  gdWhat.textContent = "The camera goes back to what it had before unless you keep this.";
  guardKeys(g.keys);
  btnKeep.hidden = false; btnUndo.hidden = false;
  gbar.hidden = false;
  gdClock.textContent = guardLeft + " s";
  if (guardTick) return;
  guardTick = setInterval(() => {
    if (guardLeft > 0) guardLeft--;
    gdClock.textContent = guardLeft + " s";
    /* Zero here is this page's own arithmetic, not the camera's word for it.
       Ask, and let the answer -- guard gone -- close the bar. */
    if (guardLeft <= 0) loadPending();
  }, 1000);
}

/* Not connected yet. No Keep button: there is nothing to confirm from a page
   that cannot reach the camera, and a button that posts into the dark would
   report a failure that means nothing. */
function showReconnect(target) {
  gdTitle.textContent = "Reconnecting…";
  gdWhat.textContent = target
    ? "Applied. Looking for the camera at " + target.replace(/^https?:\/\//, "") + "."
    : "Applied. Waiting for the camera to answer again.";
  guardKeys(null);
  btnKeep.hidden = true; btnUndo.hidden = true;
  gbar.hidden = false;
  gdClock.textContent = "";
}

async function hideGuard() {
  if (gbar.hidden) return;
  gbar.hidden = true;
  if (guardTick) { clearInterval(guardTick); guardTick = null; }
  /* Whatever ended it, the camera may now hold different values than this
     page last drew -- a revert is a change nobody made here. */
  await loadValues();
  render();
}

/* Called with any reply that reports the guard: `set`, `apply`, `pending`,
   `state`, `confirm`, `cancel`. Never with one that does not, since absence
   would then read as "disarmed" from a command that was never asked. */
function noteGuard(r) {
  const g = r && r.guard;
  if (g && g.armed) showGuard(g); else hideGuard();
}

btnKeep.addEventListener("click", async () => {
  try { noteGuard(await api({cmd:"confirm"})); wlog("sys", "settings confirmed"); }
  catch (e) { wlog("err", "! confirm: " + e.message); }
});

btnUndo.addEventListener("click", async () => {
  try { noteGuard(await api({cmd:"cancel"})); wlog("sys", "settings put back"); }
  catch (e) { wlog("err", "! cancel: " + e.message); }
});

/*
 * Where the camera will be once this is applied, when the page can work it
 * out. Only the two keys that move it are here; everything else guarded keeps
 * the address, and then the answer is "the address you are already using".
 */
function reconnectTarget(ids) {
  const port = location.port ? ":" + location.port : "";
  const url = host => location.protocol + "//" + host + port;

  /* An address the camera is about to ask a DHCP server for is not one this
     page can predict, so it does not pretend to. Nor is one it is about to
     stop having: a reset takes the address out, and where the camera comes
     back is then the lease's business. */
  const toDhcp = (ids.includes("network.dhcp") && V["network.dhcp"] === true) ||
                 ids.some(i => i.startsWith("network.") && RESET.has(i));
  if (!toDhcp && ids.includes("network.address") && V["network.address"]) return url(V["network.address"]);

  if (ids.includes("device.hostname") && V["device.hostname"] && !RESET.has("device.hostname")) {
    const n = V["device.hostname"];
    /* mdnsd answers for <name>.local; a name that is already qualified is
       one somebody's DNS is expected to know, and is used as given. */
    return url(n.includes(".") ? n : n + ".local");
  }
  return null;
}

/* One question, a short fuse, and no logging: this is asked over and over
   while the camera is not there, and every failure is expected. */
async function probe(ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({cmd: "pending"}),
      signal: ctl.signal
    });
    return res.ok ? await res.json() : null;
  } catch (e) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

/*
 * Go looking for the camera, and move this page to it when it is not coming
 * back to where we are. The redirect is a real navigation because the API is
 * same-origin: a page at the old address cannot ask the new one anything.
 *
 * Failing that, keep asking past the window -- when the timer runs out the
 * camera puts the old address back, which is this page's address, so waiting
 * is itself the recovery.
 */
async function reconnect(target) {
  showReconnect(target);
  wlog("sys", "applied — waiting for the camera" + (target ? " at " + target : ""));

  const moves = target && target !== location.origin;
  const until = Date.now() + 150000;
  let misses = 0;

  while (Date.now() < until) {
    await sleep(2000);
    const p = await probe(4000);
    if (p) {
      noteGuard(p);
      if (!p.guard) wlog("sys", "the camera is back and nothing is waiting to be confirmed");
      return;
    }
    /* Three misses is six seconds of silence -- long enough that the
       interface has gone down and not come back here, short enough that
       nobody is left staring at a dead page. */
    if (moves && ++misses === 3) {
      wlog("sys", "moving to " + target);
      location.href = target;
      return;
    }
  }

  gdTitle.textContent = "The camera has not come back";
  gdWhat.textContent = target
    ? "Try " + target + ". If it never answers, the camera puts the old settings back on its own."
    : "The camera puts the old settings back on its own; this page will find it again when it does.";
}

/* ═══ preview ════════════════════════════════════════════════════════════
   The stream this shows is the one an apply tears down, so a failure here is
   the ordinary case and not an error state. rhd answers /mjpeg with a 404
   until rvd has recreated the JPEG ring, which is a second or two after rcd
   reports the apply finished -- giving up on the first refusal is what left a
   dead preview that only a page reload fixed. */
const PREVIEW_RETRY_MS = 1200;
const PREVIEW_GIVE_UP_MS = 25000;
let previewTimer = null, previewSince = 0;

function startPreview(retrying) {
  const cam = document.getElementById("cam");
  const screen = document.getElementById("screen");
  clearTimeout(previewTimer);
  if (!retrying) previewSince = Date.now();
  screen.classList.remove("noimg");

  cam.onerror = () => {
    cam.removeAttribute("src");
    if (Date.now() - previewSince > PREVIEW_GIVE_UP_MS) {
      screen.classList.add("noimg");
      return;
    }
    previewTimer = setTimeout(() => startPreview(true), PREVIEW_RETRY_MS);
  };
  /* Cache-buster: a restarted pipeline serves a new stream on the same URL. */
  cam.src = "/mjpeg?stream=" + previewStream() + "&t=" + Date.now();

  document.getElementById("tagL").textContent =
    "mjpeg · stream " + previewStream() + " · " +
    (V["stream" + previewStream() + ".width"] || "?") + "×" +
    (V["stream" + previewStream() + ".height"] || "?");
}
/* The sub-stream when there is one: the preview should not cost the main
 * stream's bitrate on every open page. */
function previewStream() {
  return (V["stream1.enabled"] && V["stream1.jpeg"] !== false) ? 1 : 0;
}

/* ═══ status ═════════════════════════════════════════════════════════════ */
function statLine(box, k, v, cls, title) {
  const d = document.createElement("div"); d.className = "stat";
  const ke = document.createElement("span"); ke.className = "k"; ke.textContent = k;
  const ve = document.createElement("span"); ve.className = "v " + (cls || ""); ve.textContent = v;
  if (title) d.title = title;
  d.append(ke, ve); box.append(d);
}
function hhmm(secs) {
  secs = Math.max(0, Math.floor(secs));
  const d = Math.floor(secs / 86400), h = Math.floor(secs % 86400 / 3600),
        m = Math.floor(secs % 3600 / 60);
  return d ? d + "d " + h + "h" : h ? h + "h " + m + "m" : m + "m";
}

/*
 * `state` is flat: whichever daemons answered contribute their own object,
 * and a daemon that is down simply is not there. Nothing below assumes a
 * section exists.
 */
async function loadState() {
  let s;
  try { s = await api({cmd:"state"}, true); } catch (e) { return; }
  noteGuard(s);
  const box = document.getElementById("status"); box.textContent = "";
  const up = s.up || {};
  const running = Object.keys(up).filter(d => up[d]);

  statLine(box, "Pipeline", up.rvd ? "running" : "down", up.rvd ? "good" : "bad");
  statLine(box, "Daemons", running.length + " up");
  if (s.uptime !== undefined) statLine(box, "Uptime", hhmm(s.uptime));
  ["stream0", "stream1"].forEach((k, i) => {
    const st = s[k];
    if (st) statLine(box, i === 0 ? "Main" : "Sub",
                     (st.resolution || "?") + (st.fps ? " · " + st.fps + " fps" : ""));
  });
  if (s.rtsp && s.rtsp.clients !== undefined) statLine(box, "RTSP clients", String(s.rtsp.clients));
  if (s.http && s.http.clients !== undefined) statLine(box, "HTTP clients", String(s.http.clients));

  /* The ISP's ranges and its auto list, which the [image] controls are drawn
   * from -- see noteIsp. Nothing above depends on it, so it goes before the
   * readings rather than into them. */
  noteIsp(s.image || {});

  /*
   * Day/night sits here rather than over the picture. It is a reading, and
   * the two readings that decide it belong beside it: on a gain trigger the
   * switch happens when total gain crosses a threshold, so an operator
   * wondering why the camera has not gone to night wants to see the gain.
   */
  const ir = s.ir || {};
  ACT_STATE["ircut-mode"] = ir.mode || "auto";
  segShow("ircut-mode", ACT_STATE["ircut-mode"]);
  if (ir.state || ir.mode) {
    const auto = ir.mode === "auto" || ir.mode === undefined;
    statLine(box, "Day / night",
             String(ir.state || ir.mode) + (auto ? "" : " (forced " + ir.mode + ")"),
             ir.state === "night" ? "bad" : "good");
  }
  if (ir.exposure_us)
    statLine(box, "Exposure", shutter(ir.exposure_us), "", ir.exposure_us + " \u00b5s");
  if (ir.total_gain)
    statLine(box, "Gain", gain(ir.total_gain), "", "raw " + ir.total_gain + " (1024 = 1\u00d7)");
}

/*
 * What the ISP says about itself, and what changes because of it.
 *
 * Two different lifetimes in one reply. The ranges come from the silicon and
 * the tuning binary, so they move when a sensor is reloaded and not
 * otherwise; a change there is redrawn, because every control on the page was
 * built from the old ones. Which knobs are on auto changes whenever anyone
 * moves one -- from here, from MQTT, from the CLI -- so it is written into
 * the rows that are already drawn. Redrawing on that would take the page out
 * from under whoever is dragging a slider, every five seconds.
 */
function noteIsp(img) {
  ISP.live = img;
  ISP.caps = img.caps || {};
  ISP.auto = new Set((img.auto || "").split(",").filter(Boolean));

  const sig = JSON.stringify(ISP.caps);
  const moved = ISP.sig !== "" && ISP.sig !== sig;
  ISP.sig = sig;
  if (moved) { render(); return; }
  ispRefresh();
}

/*
 * The auto state of the rows already on screen.
 *
 * Skips a row the operator is working in: a key with a request in flight, one
 * staged for Apply, and one holding the focus are all rows where the page's
 * value is newer than the camera's, and writing the reading back over them is
 * how a control ends up fighting the person using it.
 */
function ispRefresh() {
  document.querySelectorAll(".row").forEach(row => {
    const id = row.dataset.id || "", k = byId[id];
    if (!k || k.section !== "image") return;
    if (inflight.has(id) || dirty.has(id) || RESET.has(id)) return;
    if (row.contains(document.activeElement)) return;
    const on = isAuto(id);
    const ab = row.querySelector(".autobtn");
    if (ab) ab.setAttribute("aria-pressed", String(on));
    const sl = row.querySelector(".sl");
    if (sl) sl.classList.toggle("auto", on);
    if (V[id] === undefined || on) syncControl(row, k, on ? "auto" : shown(id));
    const rb = row.querySelector(".readback");
    if (rb && on && !rb.classList.contains("warn")) rb.textContent = "from the tuning";
  });
}

/*
 * Exposure as a shutter fraction, which is how it is read everywhere else,
 * with the microseconds kept in the tooltip because that is what the daemon
 * reports and what a bug report should quote.
 */
function shutter(us) {
  if (!us) return "—";
  if (us >= 1000000) return (us / 1000000).toFixed(1) + " s";
  return "1/" + Math.round(1000000 / us) + " s";
}

/* Total gain arrives at 1024 per unit -- analogue and ISP gain multiplied,
 * with one factor of the unit divided back out. */
function gain(g) {
  const x = g / 1024;
  return (x < 10 ? x.toFixed(2) : x.toFixed(1)) + "\u00d7";
}

/* The log keeps filling while folded away, so opening it shows what already
 * happened rather than starting a fresh empty pane. */
(function () {
  const wire = document.getElementById("wire");
  const btn = document.getElementById("wiretoggle");
  const log = document.getElementById("log");
  btn.addEventListener("click", () => {
    const open = !wire.classList.contains("open");
    wire.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
    log.hidden = !open;
  });
})();

/* ═══ boot ═══════════════════════════════════════════════════════════════ */
function banner(title, detail) {
  const sheet = document.getElementById("sheet");
  sheet.textContent = "";
  const b = document.createElement("div"); b.className = "banner";
  const t = document.createElement("b"); t.textContent = title;
  const p = document.createElement("div"); p.textContent = detail;
  b.append(t, p);
  sheet.append(b);
}

async function loadValues() {
  const sections = [...new Set(KEYS.map(k => k.section))];
  /* One request per section, not one carrying every key: rcd asks the owning
   * daemon once per section, and a single hundred-key request would make it
   * open the daemon socket a hundred times. */
  for (const sec of sections) {
    let r;
    try { r = await api({cmd:"get", section: sec}, true); } catch (e) { continue; }
    (r.values || []).forEach(v => {
      const id = v.section + "." + v.key;
      if (!byId[id]) return;
      if (byId[id].type === "credential") { CREDSET[id] = v.set === true; return; }
      if (v.set === false || v.value === undefined || v.value === null) {
        DEFAULTED.add(id);
        /* Nobody has ever set it and no daemon answered for it, so its value
         * is whatever the daemon's own default turns out to be. Drawing a
         * switch here would claim "off" about something that may well be on,
         * which is exactly what [rtsp] did before rcd would answer for it. */
        UNSET.add(id);
        return;
      }
      UNSET.delete(id);
      if (v.configured === false) DEFAULTED.add(id); else DEFAULTED.delete(id);
      V[id] = v.value;
      SAVED[id] = v.value;
    });
  }
}

async function loadPending() {
  try {
    const p = await api({cmd:"pending"}, true);
    (p.stale || []).forEach(d => (d.keys || []).forEach(k => {
      const id = k.section + "." + k.key;
      if (byId[id]) dirty.add(id);
    }));
    /* A page loaded mid-window is the expected case, not the odd one: the
       reason this window exists is that the last one stopped answering. */
    noteGuard(p);
  } catch (e) { /* drift is a nicety; the page works without it */ }
}

async function boot() {
  let hello;
  try {
    hello = await api({cmd:"hello"});
  } catch (e) {
    banner("Cannot reach the configuration daemon", e.message +
      ". rcd answers on /var/run/rss/rcd.sock and rhd forwards this page's requests to it.");
    return;
  }
  /* The bare hash read as a mystery number. It is the raptor commit these
   * daemons were built from, which is the first thing a bug report needs. */
  const host = document.getElementById("host");
  host.textContent = [hello.platform, hello.build ? "build " + hello.build : null]
    .filter(Boolean).join(" · ") || "raptor";
  host.title = "rcd " + (hello.daemon || "") + " · config " + (hello.config || "") +
               (hello.build ? " · built from raptor " + hello.build : "");

  Object.entries(hello.daemons || {}).forEach(([name, d]) => {
    if (d && d.installed === false) MISSING_DAEMON.add(name);
  });

  const s = await api({cmd:"schema"});
  ACTIONS = s.actions || [];
  const all = s.keys || [];
  KEYS = all.filter(usable);
  const dropped = all.length - KEYS.length;
  if (dropped) wlog("sys", dropped + " keys hidden: not on this SoC or daemon not installed");
  KEYS.forEach(k => byId[id_of(k)] = k);
  learnImpacts();

  /* Any section no tab claims still gets a page, so a key added to rcd cannot
   * become unreachable by forgetting to touch this file. */
  const claimed = claimedSections();
  const orphans = [...new Set(KEYS.map(k => k.section))].filter(x => !claimed.includes(x));
  if (orphans.length) {
    TABS.push({id:"more", name:"More",
               groups: orphans.map(o => ({title: pretty(o), section: o}))});
  }

  const tabsEl = document.getElementById("tabs");
  const shown = [];
  TABS.forEach(t => {
    const secs = tabSections(t);
    const n = KEYS.filter(k => secs.includes(k.section)).length;
    /* Nothing left and no actions to offer: the build does not have this. */
    const acts = t.groups.some(g => (g.actions || []).some(a => ACTIONS.find(x => x.name === a)));
    if (!n && !acts) return;
    shown.push(t.id);
    const b = document.createElement("button");
    b.className = "tab"; b.dataset.id = t.id; b.setAttribute("role", "tab");
    b.append(document.createTextNode(t.name));
    const c = document.createElement("span"); c.className = "cnt"; c.textContent = n || "";
    const dot = document.createElement("span"); dot.className = "dot";
    b.append(c, dot);
    b.addEventListener("click", () => {
      active = t.id; render(); document.querySelector(".sheet").scrollTop = 0;
    });
    tabsEl.append(b);
  });

  if (shown.length && !shown.includes(active)) active = shown[0];

  await loadValues();
  await loadPending();
  /* Before the first render, not after it: [image] is drawn from the ranges
     the ISP publishes here, and a page built from the table's own bounds
     first would draw every knob on the wrong scale and then redraw it. */
  await loadState();
  render();
  refreshBar();
  startPreview();
  setInterval(loadState, 5000);
}

boot();
</script>
